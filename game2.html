<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipul's Block Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #1d1d1d;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 32px 32px;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* Minecraft Inventory Slot Styling */
        .mc-slot {
            background-color: #8b8b8b;
            border: 4px solid;
            border-top-color: #373737;
            border-left-color: #373737;
            border-bottom-color: #ffffff;
            border-right-color: #ffffff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        /* Minecraft Button Styling */
        .mc-button {
            background-color: #c6c6c6;
            border: 4px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-bottom-color: #555555;
            border-right-color: #555555;
            color: #222;
            transition: all 0.05s ease;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }
        
        .mc-button:active {
            border-top-color: #555555;
            border-left-color: #555555;
            border-bottom-color: #ffffff;
            border-right-color: #ffffff;
            background-color: #a0a0a0;
        }

        .mc-input {
            background-color: #1e1e1e;
            border: 4px solid;
            border-top-color: #000000;
            border-left-color: #000000;
            border-bottom-color: #555555;
            border-right-color: #555555;
            color: #fff;
        }

        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .mc-text-shadow {
            text-shadow: 2px 2px 0px #3f3f3f;
        }

        .receipt-bg {
            background-color: #f6e5b4;
            color: #000;
            border: 4px solid #4a3525;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .emoji-icon {
            font-size: 3.5rem;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3));
        }

        .sticky-header {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border-bottom: 4px solid #111;
        }
    </style>
</head>
<body class="pb-20">

    <!-- Top Branding -->
    <nav class="bg-black py-4 px-6 text-3xl text-center text-gray-300 tracking-widest border-b-4 border-gray-700 mc-text-shadow">
        VIPUL'S BLOCK MARKET
    </nav>

    <!-- Sticky Total Bar (Emeralds) -->
    <div class="sticky-header text-center py-6 sticky top-0 z-50 shadow-2xl">
        <h2 class="text-2xl text-gray-400 mb-1">EMERALDS SPENT</h2>
        <div class="text-5xl sm:text-7xl font-bold text-[#55ff55] mc-text-shadow flex items-center justify-center gap-4" id="total-spent">
            <span class="text-4xl">🟢</span> 0
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-10">
        
        <!-- Items Grid -->

            <!-- Injected by JS -->
        </div>

        <!-- Receipt Section -->
        <div id="receipt-container" class="mt-16 receipt-bg max-w-3xl mx-auto py-10 px-8 sm:px-16 hidden">
            <h2 class="text-4xl font-bold text-center mb-8 border-b-4 border-dotted border-gray-800 pb-4">TRADE RECEIPT</h2>
            
            <div id="receipt-items" class="flex flex-col gap-2 mb-6 text-2xl">
                <!-- Receipt rows -->
            </div>
            
            <div class="flex justify-between border-t-4 border-black pt-4 font-bold text-3xl mt-6">
                <span>TOTAL:</span>
                <span id="receipt-total" class="text-green-800 flex items-center gap-2">🟢 0</span>
            </div>

            <!-- Share Button -->
            <div class="flex justify-center mt-12">
                <button onclick="shareOnX()" class="mc-button font-bold text-2xl py-3 px-8 flex items-center gap-3">
                    <svg viewBox="0 0 24 24" class="w-6 h-6 fill-current"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    SHARE TO 𝕏
                </button>
            </div>
        </div>
    </div>

            { id: 80, name: "Shears", price: 100, icon: "✂️" },

            // Rare, Magic & Misc
            { id: 81, name: "Ender Pearl", price: 500, icon: "🔮" },
            { id: 82, name: "Eye of Ender", price: 1200, icon: "👁️‍🗨️" },

            { id: 85, name: "Magma Cream", price: 1000, icon: "🟠" },
            { id: 86, name: "Slimeball", price: 150, icon: "🟢" },
            { id: 87, name: "Phantom Membrane", price: 3000, icon: "🦇" },
            { id: 88, name: "Shulker Shell", price: 5000, icon: "🪸" },
            { id: 89, name: "Totem of Undying", price: 25000, icon: "🏺" },
            { id: 90, name: "Elytra", price: 75000, icon: "🦋" },
            { id: 91, name: "Dragon Breath", price: 10000, icon: "💨" },
            { id: 92, name: "Nether Star", price: 500000, icon: "⭐" },
            { id: 93, name: "Beacon", price: 650000, icon: "🗼" },
            { id: 94, name: "Heart of the Sea", price: 150000, icon: "💙" },
            { id: 95, name: "Conduit", price: 200000, icon: "🌀" },
            { id: 96, name: "Music Disc", price: 5000, icon: "💿" },
            { id: 97, name: "Saddle", price: 1500, icon: "💺" },
            { id: 98, name: "Horse Armor (Diamond)", price: 10000, icon: "🐎💎" },
            { id: 99, name: "Command Block", price: 50000000, icon: "🎛️" },
            { id: 100, name: "Dragon Egg", price: 1000000000, icon: "🥚🐉" }
        ];

        let quantities = {};
        let totalSpent = 0;

        function formatAbbreviated(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(num % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'K';
            return num;
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            
            items.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = "mc-slot p-4 flex flex-col items-center justify-between";
                
                card.innerHTML = `
                    <div class="emoji-icon mb-2">${item.icon}</div>
                    <h3 class="text-xl text-white mt-1 text-center leading-tight mc-text-shadow line-clamp-2 h-14 flex items-center justify-center">${item.name}</h3>
                    <p class="text-[#55ff55] text-2xl mc-text-shadow mb-4">🟢 ${formatAbbreviated(item.price)}</p>
                    
                    <div class="grid grid-cols-[1fr_1.2fr_1fr] gap-1 w-full mt-auto">
                        <button onclick="updateQty(${item.id}, -1)" class="mc-button text-xl py-1 px-1 text-center select-none">
                            -
                        </button>
                        
                        <input type="number" id="input-${item.id}" value="0" min="0" 
                            class="mc-input text-center w-full text-2xl outline-none"
                            onchange="manualUpdate(${item.id}, this.value)">
                        
                        <button onclick="updateQty(${item.id}, 1)" class="mc-button text-xl py-1 px-1 text-center select-none">
                            +
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            
            quantities[id] = current;
            document.getElementById(`input-${id}`).value = current;
            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            items.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            
            document.getElementById('total-spent').innerHTML = `<span class="text-4xl sm:text-6xl">🟢</span> ${formatNumber(totalSpent)}`;
            updateReceipt();
        }

        function updateReceipt() {
            const container = document.getElementById('receipt-container');
            const receiptDiv = document.getElementById('receipt-items');
            
            if (totalSpent === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            receiptDiv.innerHTML = '';
            
            items.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const itemTotal = item.price * qty;
                    receiptDiv.innerHTML += `
                        <div class="flex justify-between items-center py-1">
                            <div class="w-[45%] text-left pr-2 truncate">${item.name}</div>
                            <div class="w-[20%] text-left">x${qty}</div>
                            <div class="w-[35%] text-right font-bold text-green-900">🟢 ${formatAbbreviated(itemTotal)}</div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('receipt-total').innerHTML = `🟢 ${formatNumber(totalSpent)}`;
        }

        function shareOnX() {
            const text = `I just dropped 🟢 ${formatNumber(totalSpent)} Emeralds at Vipul's Block Market! ⛏️ Can you out-trade me?`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Initialize App
        renderGrid();
    </script>
</body>
</html>

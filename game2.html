<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>Game 2 — Cosmic Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body data-game-index="1">

  <div class="bg-void"></div>
  <div class="bg-grid"></div>
  <div class="bg-orbit-wrap"><svg id="orbit-svg" viewBox="0 0 700 700"></svg></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <button id="settings-btn" class="settings-btn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" type="button">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="19" r="1.6" fill="currentColor"></circle>
    </svg>
  </button>

  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Sound</span>
      <button class="settings-toggle" id="sound-toggle" role="switch" aria-checked="true" type="button"></button>
    </div>
  </div>

  <div class="app-container">
    <div class="stage">
      <span class="stage-number">Slot 2 of 7</span>
      <h2>Game 2</h2>
      <p>Not built yet — this is a reserved placeholder in the Cosmic Arcade ecosystem.</p>
    </div>
  </div>

  <nav class="game-nav" id="game-nav" aria-label="Game navigation" tabindex="0">
    <button class="game-nav-btn" id="back-game-btn" aria-label="Previous game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 5 7.5 12l9 7Z"></path>
      </svg>
    </button>
    <button class="game-nav-btn random-btn" id="random-game-btn" aria-label="Random game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
    <button class="game-nav-btn" id="next-game-btn" aria-label="Next game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 5l9 7-9 7Z"></path>
      </svg>
    </button>
  </nav>

<script src="shared.js"></script>
</body>
</html>
<!--
  GAME 2 — RESERVED SLOT (not yet built)
  ==========================================
  This is slot 2 of 7 in the Cosmic Arcade ecosystem (see index.html,
  the Cosmic Calendar, for the first real game and the shared-chrome
  explanation). No concept has been chosen for this slot yet — its
  currently just a centered "Game 2" label inside the shared .stage
  layout so the back/random/next game nav has something to land on.

  For whoever (human or AI) builds this next: replace the .stage block
  in <body> with the real game markup, add any game-specific CSS in a
  <style> block in <head> (after the shared.css link, same pattern as
  index.html), and add game-specific JS in a <script> block after
  shared.js. Leave shared.css/shared.js untouched and keep the
  data-game-index attribute on <body> as-is (it's what tells the
  shared nav which slot this page is) — then update THIS comment to
  describe the finished game's idea instead of "not yet built".
-->

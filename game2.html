<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030303;
            --card-bg: rgba(18, 18, 18, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* Premium Item Card */
        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .item-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            background: rgba(24, 24, 24, 0.85);
        }

        /* Pixel Art Canvas Container */
        .icon-slot {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            border: 1px solid #222;
            position: relative;
            user-select: none;
            transition: all 0.3s ease;
        }
        @media (min-width: 640px) {
            .icon-slot { width: 80px; height: 80px; }
        }
        
        .pixel-canvas {
            width: 56px;
            height: 56px;
            image-rendering: pixelated; /* Ensures sharp pixels */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .item-card:hover .pixel-canvas { transform: scale(1.15) rotate(3deg); }

        /* Subtle Rarity Glows */
        .rarity-common .icon-slot { box-shadow: inset 0 0 15px rgba(255,255,255,0.03); border-color: #2a2a2a; }
        .rarity-uncommon .icon-slot { box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.25); }
        .rarity-rare .icon-slot { box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.35); }
        .rarity-epic .icon-slot { box-shadow: inset 0 0 25px rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.45); }
        .rarity-legendary .icon-slot { box-shadow: inset 0 0 30px rgba(245, 158, 11, 0.25); border-color: rgba(245, 158, 11, 0.5); }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #a3a3a3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.15s;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .ctrl-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.25); }

        .price-font { font-family: 'Space Grotesk', sans-serif; }
        
        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>

            ["Potato", 0.05, "potato"], ["Cake", 12.00, "cake"], ["Suspicious Stew", 120.00, "stew"], ["Sweet Berries", 0.80, "berries"], ["Chorus Fruit", 150.00, "chorus"], ["Piece of Coal", 8.00, "coal"], ["Iron Ingot", 80.00, "ingot_iron"], ["Gold Ingot", 650.00, "ingot_gold"], ["Rough Diamond", 2800.00, "gem_diamond"], ["Flawless Emerald", 1200.00, "gem_emerald"],
            ["Netherite Ingot", 250000, "ingot_netherite"], ["Lapis Lazuli", 50, "gem_lapis"], ["Redstone Dust", 120, "dust_redstone"], ["Copper Ingot", 80, "ingot_copper"], ["Amethyst Shard", 1500, "gem_amethyst"], ["Nether Quartz", 300, "quartz"], ["Wooden Stick", 1, "stick"], ["Spider String", 10, "string"], ["Gunpowder", 200, "gunpowder"], ["Cow Leather", 25, "leather"],
            ["Ender Pearl", 15000, "pearl"], ["Eye of Ender", 35000, "eye"], ["Totem of Undying", 10000000, "totem"], ["Elytra Wings", 50000000, "elytra"], ["Leather Saddle", 350, "saddle"], ["Nametag", 5000, "nametag"], ["Wooden Bow", 150, "bow"], ["Flint Arrow", 5, "arrow"], ["Enchanted Trident", 2500000, "trident"], ["Wooden Shield", 250, "shield"]
        ];

        const inventory = [];
        let idCounter = 1;

        function getRarityClass(price) {
            if (price >= 1000000) return 'rarity-legendary';
            if (price >= 25000) return 'rarity-epic';
            if (price >= 1000) return 'rarity-rare';
            if (price >= 50) return 'rarity-uncommon';
            return 'rarity-common';
        }

        rawData.forEach(b => {
            inventory.push({ id: idCounter++, name: b[0], price: b[1], palette: b[2], rarity: getRarityClass(b[1]) });
        });

        // ==========================================
        // 3. UI & LOGIC
        // ==========================================
        const quantities = {};
        let totalSpent = 0;

        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
        }

        function formatShorthand(num) {
            if (num >= 1e12) return '$' + (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(num % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'K';
            if (num > 0 && num < 1) return '$' + num.toFixed(2);
            if (num % 1 !== 0) return '$' + num.toFixed(2);
            return '$' + num;
        }

        function initGrid() {
            const grid = document.getElementById('items-grid');
            inventory.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = `item-card rounded-[20px] p-4 sm:p-5 ${item.rarity}`;
                
                card.innerHTML = `
                    <div class="icon-slot"><canvas id="canvas-${item.id}" width="56" height="56" class="pixel-canvas"></canvas></div>
                    <div class="flex-grow flex flex-col items-center justify-start w-full">
                        <h3 class="text-sm sm:text-base font-semibold text-center text-gray-200 leading-snug mb-2 w-full">${item.name}</h3>
                    </div>
                    <div class="mt-auto w-full pt-1">
                        <p class="text-white price-font text-center font-bold text-base sm:text-lg mb-3 tracking-wide opacity-90">${formatShorthand(item.price)}</p>
                        <div class="flex items-center justify-between w-full gap-1 sm:gap-2 bg-black/60 p-1 rounded-xl border border-white/10">
                            <button onclick="updateQty(${item.id}, -1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg transition-transform select-none">-</button>
                            <input type="number" id="input-${item.id}" value="0" min="0" 
                                class="bg-transparent text-center font-bold text-white w-full min-w-0 outline-none price-font text-sm sm:text-base px-0.5"
                                oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
                            <button onclick="updateQty(${item.id}, 1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg transition-transform select-none">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Draw pixel art onto all canvas elements
            setTimeout(drawAllPixelArt, 100);
        }

        function drawAllPixelArt() {
            inventory.forEach(item => {
                const canvas = document.getElementById(`canvas-${item.id}`);
                const ctx = canvas.getContext('2d');
                const map = getMap(item.name);
                const colors = palettes[item.palette];
                const size = 4; // 14x14 grid * 4px = 56px canvas
                
                for(let y=0; y<14; y++) {
                    for(let x=0; x<14; x++) {
                        const val = map[y][x];
                        if(val !== '0') {
                            ctx.fillStyle = colors[parseInt(val)-1];
                            ctx.fillRect(x*size, y*size, size, size);
                            
                            // Procedural Minecraft-style texture noise for blocks
                            if(map === blockMap && val !== '1') {
                                if(Math.random() > 0.6) {
                                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
                                    ctx.fillRect(x*size, y*size, size, size);
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            if (current > 9999999) current = 9999999;
            quantities[id] = current;
            
            const inputEl = document.getElementById(`input-${id}`);
            inputEl.value = current;
            inputEl.style.transform = 'scale(1.1)';
            setTimeout(() => inputEl.style.transform = 'scale(1)', 150);
            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            if (num > 9999999) num = 9999999;
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            inventory.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            document.getElementById('total-spent').innerText = formatShorthand(totalSpent) === '$0' ? '$0.00' : formatShorthand(totalSpent);
            
            if (!document.getElementById('receipt-modal').classList.contains('hidden')) {
                buildReceipt();
            }
        }

        // ==========================================
        // 4. MODAL & RECEIPT
        // ==========================================
        const modal = document.getElementById('receipt-modal');
        const modalContent = document.getElementById('receipt-content');

        function openReceipt() {
            if (totalSpent === 0) {
                alert("Your inventory cart is empty.");
                return;
            }
            buildReceipt();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeReceipt() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function buildReceipt() {
            const list = document.getElementById('receipt-list');
            list.innerHTML = '';
            
            inventory.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const lineTotal = item.price * qty;
                    // Redraw canvas for receipt
                    const canvasId = `receipt-canvas-${item.id}`;
                    list.innerHTML += `
                        <div class="flex items-center justify-between py-3 border-b border-[#222] last:border-0">
                            <div class="flex items-center gap-3 sm:gap-4 w-1/2">
                                <canvas id="${canvasId}" width="28" height="28" style="image-rendering: pixelated;" class="filter grayscale brightness-150"></canvas>
                                <span class="text-gray-200 leading-tight truncate">${item.name}</span>
                            </div>
                            <div class="w-1/6 text-right text-gray-500 font-bold">x${qty}</div>
                            <div class="w-1/3 text-right price-font text-white font-bold tracking-wide">${formatShorthand(lineTotal)}</div>
                        </div>
                    `;
                    
                    // Draw tiny receipt version
                    setTimeout(() => {
                        const rCanvas = document.getElementById(canvasId);
                        if(rCanvas) {
                            const ctx = rCanvas.getContext('2d');
                            const map = getMap(item.name);
                            const colors = palettes[item.palette];
                            const size = 2; // 14*2 = 28px
                            for(let y=0; y<14; y++) {
                                for(let x=0; x<14; x++) {
                                    const val = map[y][x];
                                    if(val !== '0') {
                                        ctx.fillStyle = colors[parseInt(val)-1];
                                        ctx.fillRect(x*size, y*size, size, size);
                                    }
                                }
                            }
                        }
                    }, 10);
                }
            });
            
            document.getElementById('receipt-total').innerText = formatMoney(totalSpent);
        }

        function shareOnX() {
            const text = `I just dropped ${formatMoney(totalSpent)} on the Block Market! 💸 Try to beat my high score.`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Run
        initGrid();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Market — Voxel Exchange</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070a;
  --surface:rgba(17,19,25,0.62);
  --surface-hover:rgba(24,27,35,0.88);
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(255,255,255,0.2);
  --text:#eef1f6;
  --text-dim:#8a92a3;
  --emerald:#34d97a;
  --blue:#5b8cff;
  --amber:#f6b93b;
  --violet:#b18cfb;
  --red:#ff6767;
  --font-display:'Outfit',sans-serif;
  --font-mono:'Space Grotesk',sans-serif;
  --font-pixel:'Press Start 2P',monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font-display);
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 8% 15%, rgba(52,217,122,0.07) 0%, transparent 42%),
    radial-gradient(circle at 92% 85%, rgba(91,140,255,0.07) 0%, transparent 42%),
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 28px 28px, 28px 28px;
  background-attachment:fixed;
  color:var(--text);
  overflow-x:hidden;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#000;}
::-webkit-scrollbar-thumb{background:#2a2d35;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#3c4050;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type="number"]{-moz-appearance:textfield;}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;}

.price-font{font-family:var(--font-mono);}
.pixel-font{font-family:var(--font-pixel);}
.gradient-text{
  background:linear-gradient(135deg,#34d97a 0%,#5b8cff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ---------- Header ---------- */
.delta-toast{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-weight:700;font-size:0.85rem;
  pointer-events:none;animation:floatUp 0.9s ease-out forwards;white-space:nowrap;
}
.delta-pos{color:var(--emerald);}
.delta-neg{color:var(--red);}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,-26px);}}

.ctrl-btn{
  background:rgba(255,255,255,0.05);color:#a3a3a3;border:1px solid rgba(255,255,255,0.1);
  transition:all 0.15s;
}
.ctrl-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.ctrl-btn:active{transform:scale(0.9);background:rgba(255,255,255,0.25);}

/* ---------- Filter bar ---------- */
.filterbar{
  position:sticky;top:80px;z-index:40;
  background:rgba(5,7,10,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
}
@media(min-width:640px){.filterbar{padding:14px 32px;}}
.search-wrap{position:relative;flex-shrink:0;}
.search-input{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:9999px;
  padding:9px 14px 9px 38px;color:var(--text);font-size:0.9rem;width:100%;
  transition:border-color 0.15s,background 0.15s;
}
.search-input::placeholder{color:var(--text-dim);}
.search-input:focus{background:rgba(255,255,255,0.08);border-color:var(--border-hover);outline:none;}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;}

.tabs-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px;}
.tabs-row::-webkit-scrollbar{display:none;}
.tab-pill{
  flex-shrink:0;font-size:0.78rem;font-weight:600;padding:7px 14px;border-radius:9999px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-dim);
  cursor:pointer;transition:all 0.15s;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.tab-pill:hover{background:rgba(255,255,255,0.09);color:var(--text);}
.tab-pill.active{background:linear-gradient(135deg,rgba(52,217,122,0.18),rgba(91,140,255,0.18));border-color:rgba(255,255,255,0.28);color:#fff;}
.tab-count{font-family:var(--font-mono);font-size:0.7rem;opacity:0.65;}

.sort-select{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:9999px;
  padding:8px 14px;color:var(--text);font-size:0.8rem;cursor:pointer;
}

/* ---------- Item cards ---------- */
.item-card{
  background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.3);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden;
  opacity:0;transform:translateY(14px);
  animation:cardIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0);}}
.item-card:hover{
  border-color:var(--border-hover);transform:translateY(-4px);
  box-shadow:0 14px 32px rgba(0,0,0,0.6);background:var(--surface-hover);
}

.rarity-badge{
  position:absolute;top:8px;left:8px;font-family:var(--font-pixel);font-size:6.5px;
  padding:4px 6px;border-radius:5px;letter-spacing:0.04em;z-index:2;
  background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.12);
}
.rarity-common .rarity-badge{color:#9aa1ad;}
.rarity-uncommon .rarity-badge{color:var(--emerald);}
.rarity-rare .rarity-badge{color:var(--blue);}
.rarity-epic .rarity-badge{color:var(--violet);}
.rarity-legendary .rarity-badge{color:var(--amber);}

.icon-slot{
  width:76px;height:76px;margin:6px auto 14px auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:#0a0a0c;border:1px solid #1e1e22;position:relative;user-select:none;
  transition:all 0.3s ease;perspective:400px;
}
@media(min-width:640px){.icon-slot{width:84px;height:84px;}}
.icon-svg{width:58px;height:58px;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);filter:drop-shadow(0 4px 7px rgba(0,0,0,0.75));}
@media(min-width:640px){.icon-svg{width:64px;height:64px;}}
.item-card:hover .icon-svg.icon-cube{transform:scale(1.14) rotateY(14deg);}
.item-card:hover .icon-svg.icon-pixel{transform:scale(1.15) rotate(3deg);}

.rarity-common .icon-slot{box-shadow:inset 0 0 15px rgba(255,255,255,0.03);border-color:#242429;}
.rarity-uncommon .icon-slot{box-shadow:inset 0 0 18px rgba(52,217,122,0.12);border-color:rgba(52,217,122,0.28);}
.rarity-rare .icon-slot{box-shadow:inset 0 0 18px rgba(91,140,255,0.16);border-color:rgba(91,140,255,0.35);}
.rarity-epic .icon-slot{box-shadow:inset 0 0 22px rgba(177,140,251,0.2);border-color:rgba(177,140,251,0.45);}
.rarity-legendary .icon-slot{box-shadow:inset 0 0 26px rgba(246,185,59,0.24);border-color:rgba(246,185,59,0.55);animation:legendaryPulse 2.4s ease-in-out infinite;}
@keyframes legendaryPulse{
  0%,100%{box-shadow:inset 0 0 26px rgba(246,185,59,0.24),0 0 0 rgba(246,185,59,0);}
  50%{box-shadow:inset 0 0 30px rgba(246,185,59,0.4),0 0 14px rgba(246,185,59,0.28);}
}

.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;color:var(--text-dim);}
.empty-state.show{display:flex;}
.empty-state button{margin-top:14px;}

/* ---------- Receipt modal ---------- */
#receipt-modal{transition:opacity 0.3s;}
#receipt-content{transition:transform 0.3s;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}
</style>
</head>

// ==========================================
// 4. CATEGORIES
// ==========================================
const CATEGORY_SETS = {
  weapons: new Set(["Wooden Pickaxe","Stone Sword","Iron Pickaxe","Iron Sword","Golden Axe","Diamond Pickaxe","Diamond Sword","Netherite Sword","Netherite Pickaxe","Wooden Bow","Flint Arrow","Enchanted Trident","Wooden Shield"]),
  armor: new Set(["Diamond Helmet","Diamond Chestplate","Diamond Leggings","Diamond Boots","Netherite Chestplate"]),
  food: new Set(["Apple","Bread","Cooked Beef (Steak)","Golden Apple","Enchanted Golden Apple","Carrot","Potato","Cake","Suspicious Stew","Sweet Berries","Chorus Fruit"]),
  materials: new Set(["Piece of Coal","Iron Ingot","Gold Ingot","Rough Diamond","Flawless Emerald","Netherite Ingot","Lapis Lazuli","Redstone Dust","Copper Ingot","Amethyst Shard","Nether Quartz","Wooden Stick","Spider String","Gunpowder","Cow Leather"]),
  rare: new Set(["Ender Pearl","Eye of Ender","Totem of Undying","Elytra Wings","Leather Saddle","Nametag"])
};
const CATEGORY_LABELS = {all:"All Items", blocks:"Blocks", weapons:"Weapons & Tools", armor:"Armor", food:"Food", materials:"Materials & Gems", rare:"Rare & Magic"};

function getCategory(name){
  for(const cat in CATEGORY_SETS){ if(CATEGORY_SETS[cat].has(name)) return cat; }
  return 'blocks';
}
function getShape(name, category){
  const n = name.toLowerCase();
  if(category === 'weapons'){
    if(n.includes('sword') || n.includes('trident')) return swordMap;
    if(n.includes('pickaxe')) return pickMap;
    if(n.includes('axe')) return axeMap;
    if(n.includes('bow')) return bowMap;
    if(n.includes('arrow')) return arrowMap;
    if(n.includes('shield')) return shieldMap;
  }
  if(category === 'armor'){
    if(n.includes('helmet')) return helmMap;
    if(n.includes('chestplate')) return chestMap;
    if(n.includes('leggings')) return legMap;
    if(n.includes('boots')) return bootMap;
  }
  if(category === 'food') return foodMap;
  if(category === 'materials'){
    const ingotWords=['ingot','coal','leather','stick','string','gunpowder'];
    if(ingotWords.some(w=>n.includes(w))) return ingotMap;
    return gemMap;
  }
  if(category === 'rare') return gemMap;
  return null; // blocks -> isometric cube
}
function rarityInfo(price){
  if(price>=1000000) return {cls:'rarity-legendary', label:'LEGENDARY'};
  if(price>=25000) return {cls:'rarity-epic', label:'EPIC'};
  if(price>=1000) return {cls:'rarity-rare', label:'RARE'};
  if(price>=50) return {cls:'rarity-uncommon', label:'UNCOMMON'};
  return {cls:'rarity-common', label:'COMMON'};
}
const RARITY_RANK = {'rarity-legendary':4,'rarity-epic':3,'rarity-rare':2,'rarity-uncommon':1,'rarity-common':0};

// ==========================================
// 5. ICON RENDERING (pure SVG, no canvas)
// ==========================================
function hexToRgb(hex){
  let h = hex.replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const num = parseInt(h,16);
  return [(num>>16)&255,(num>>8)&255,num&255];
}
function luminance(hex){
  const [r,g,b] = hexToRgb(hex);
  return 0.299*r+0.587*g+0.114*b;
}
function isoCubeSVG(paletteKey, uid){
  const p = palettes[paletteKey] || palettes.stone;
  const shaded = [p[1],p[2],p[3]].map(c=>({hex:c,lum:luminance(c)})).sort((a,b)=>b.lum-a.lum);
  const top = shaded[0].hex, right = shaded[1].hex, left = shaded[2].hex;
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="icon-svg icon-cube">
    <defs><linearGradient id="shine-${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient></defs>
    <g stroke="${p[0]}" stroke-width="1.3" stroke-linejoin="round">
      <polygon points="32,5 55,19 32,33 9,19" fill="${top}"/>
      <polygon points="9,19 32,33 32,58 9,44" fill="${left}"/>
      <polygon points="55,19 32,33 32,58 55,44" fill="${right}"/>
    </g>
    <polygon points="32,5 55,19 32,33 9,19" fill="url(#shine-${uid})"/>
  </svg>`;
}
function pixelSVG(map, paletteKey){
  const p = palettes[paletteKey] || palettes.stone;
  const cell = 4;
  let rects = '';
  for(let y=0;y<14;y++){
    for(let x=0;x<14;x++){
      const v = map[y][x];
      if(v!=='0') rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${p[parseInt(v)-1]}"/>`;
    }
  }
  return `<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" class="icon-svg icon-pixel">${rects}</svg>`;
}
function generateIcon(item){
  return item.map ? pixelSVG(item.map, item.palette) : isoCubeSVG(item.palette, 'i'+item.id);
}

// ==========================================
// 6. INVENTORY
// ==========================================
const inventory = rawData.map((row,i)=>{
  const [name, price, palette] = row;
  const category = getCategory(name);
  const map = getShape(name, category);
  const rarity = rarityInfo(price);
  return { id:i+1, name, price, palette, category, map, rarityCls:rarity.cls, rarityLabel:rarity.label };
});
const quantities = {};
inventory.forEach(it=>quantities[it.id]=0);
let totalSpent = 0;
let displayedTotal = 0;

// ==========================================
// 7. FORMATTING
// ==========================================
function formatMoney(amount){
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(amount);
}
function formatShorthand(num){
  const sign = num<0?'-':'';
  num = Math.abs(num);
  if(num >= 1e12) return sign+'$'+(num/1e12).toFixed(1).replace(/\.0$/,'')+'T';
  if(num >= 1e9) return sign+'$'+(num/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(num >= 1e6) return sign+'$'+(num/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(num >= 1e3) return sign+'$'+(num/1e3).toFixed(num%1000===0?0:1).replace(/\.0$/,'')+'K';
  if(num > 0 && num < 1) return sign+'$'+num.toFixed(2);
  if(num % 1 !== 0) return sign+'$'+num.toFixed(2);
  return sign+'$'+num;
}

// ==========================================
// 8. FILTER / SORT / SEARCH STATE
// ==========================================
let currentCategory = 'all';
let searchTerm = '';
let sortMode = 'featured';

function buildTabs(){
  const counts = {all: inventory.length};
  inventory.forEach(it=>{counts[it.category] = (counts[it.category]||0)+1;});
  const order = ['all','blocks','weapons','armor','food','materials','rare'];
  const el = document.getElementById('category-tabs');
  el.innerHTML = order.map(cat=>`
    <button class="tab-pill${cat===currentCategory?' active':''}" data-cat="${cat}">
      ${CATEGORY_LABELS[cat]} <span class="tab-count">${counts[cat]||0}</span>
    </button>`).join('');
  el.querySelectorAll('.tab-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentCategory = btn.dataset.cat; render(); });
  });
}

function getFilteredSorted(){
  let list = inventory.filter(it=>{
    if(currentCategory !== 'all' && it.category !== currentCategory) return false;
    if(searchTerm && !it.name.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
  switch(sortMode){
    case 'price-asc': list = [...list].sort((a,b)=>a.price-b.price); break;
    case 'price-desc': list = [...list].sort((a,b)=>b.price-a.price); break;
    case 'name-asc': list = [...list].sort((a,b)=>a.name.localeCompare(b.name)); break;
    case 'rarity-desc': list = [...list].sort((a,b)=>RARITY_RANK[b.rarityCls]-RARITY_RANK[a.rarityCls] || b.price-a.price); break;
    default: break;
  }
  return list;
}

// ==========================================
// 9. RENDER
// ==========================================
function render(){
  buildTabs();
  const list = getFilteredSorted();
  const grid = document.getElementById('items-grid');
  const empty = document.getElementById('empty-state');
  if(list.length === 0){
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');
  grid.innerHTML = list.map((item, idx)=>{
    const qty = quantities[item.id] || 0;
    const delay = Math.min(idx*15, 500);
    return `
    <div class="item-card rounded-[20px] p-4 sm:p-5 ${item.rarityCls}" style="animation-delay:${delay}ms">
      <span class="rarity-badge">${item.rarityLabel}</span>
      <div class="icon-slot">${generateIcon(item)}</div>
      <div class="flex-grow flex flex-col items-center justify-start w-full">
        <h3 class="text-sm sm:text-base font-semibold text-center text-gray-200 leading-snug mb-2 w-full">${item.name}</h3>
      </div>
      <div class="mt-auto w-full pt-1">
        <p class="text-white price-font text-center font-bold text-base sm:text-lg mb-3 tracking-wide opacity-90">${formatShorthand(item.price)}</p>
        <div class="flex items-center justify-between w-full gap-1 sm:gap-2 bg-black/60 p-1 rounded-xl border border-white/10">
          <button onclick="updateQty(${item.id}, -1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg select-none">-</button>
          <input type="number" id="input-${item.id}" value="${qty}" min="0"
            class="bg-transparent text-center font-bold text-white w-full min-w-0 outline-none price-font text-sm sm:text-base px-0.5"
            oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
          <button onclick="updateQty(${item.id}, 1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg select-none">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ==========================================
// 10. CART LOGIC
// ==========================================
function animateTotal(to){
  const from = displayedTotal;
  const start = performance.now();
  const dur = 320;
  function step(t){
    const p = Math.min(1,(t-start)/dur);
    const eased = 1-Math.pow(1-p,3);
    displayedTotal = from + (to-from)*eased;
    const el = document.getElementById('total-spent');
    el.textContent = displayedTotal < 0.005 ? '$0.00' : formatShorthand(displayedTotal);
    if(p<1) requestAnimationFrame(step); else displayedTotal = to;
  }
  requestAnimationFrame(step);
}
function spawnDeltaToast(delta){
  if(!delta) return;
  const wrap = document.getElementById('ticker-wrap');
  const el = document.createElement('span');
  el.className = 'delta-toast ' + (delta>0?'delta-pos':'delta-neg');
  el.textContent = (delta>0?'+':'-') + formatShorthand(Math.abs(delta));
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}
function calculateTotal(){
  let newTotal = 0;
  inventory.forEach(item=>{ newTotal += item.price * (quantities[item.id]||0); });
  const delta = newTotal - totalSpent;
  totalSpent = newTotal;
  animateTotal(newTotal);
  spawnDeltaToast(delta);
  if(!document.getElementById('receipt-modal').classList.contains('hidden')) buildReceipt();
}
function updateQty(id, change){
  let current = quantities[id] || 0;
  current += change;
  if(current < 0) current = 0;
  if(current > 9999999) current = 9999999;
  quantities[id] = current;
  const inputEl = document.getElementById(`input-${id}`);
  if(inputEl){
    inputEl.value = current;
    inputEl.style.transform = 'scale(1.1)';
    setTimeout(()=>inputEl.style.transform='scale(1)', 150);
  }
  calculateTotal();
}
function manualUpdate(id, value){
  let num = parseInt(value);
  if(isNaN(num) || num < 0) num = 0;
  if(num > 9999999) num = 9999999;
  quantities[id] = num;
  const el = document.getElementById(`input-${id}`);
  if(el) el.value = num;
  calculateTotal();
}
function clearCart(){
  if(totalSpent === 0) return;
  inventory.forEach(it=>quantities[it.id]=0);
  render();
  calculateTotal();
}
function resetFilters(){
  currentCategory = 'all'; searchTerm = '';
  document.getElementById('search-input').value = '';
  render();
}

// ==========================================
// 11. RECEIPT MODAL
// ==========================================
const modal = document.getElementById('receipt-modal');
const modalContent = document.getElementById('receipt-content');
function openReceipt(){
  if(totalSpent === 0){ alert("Your inventory cart is empty."); return; }
  buildReceipt();
  modal.classList.remove('hidden'); modal.classList.add('flex');
  setTimeout(()=>{
    modal.classList.remove('opacity-0');
    modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100');
  }, 10);
}
function closeReceipt(){
  modal.classList.add('opacity-0');
  modalContent.classList.remove('scale-100'); modalContent.classList.add('scale-95');
  setTimeout(()=>{ modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
}
function buildReceipt(){
  const list = document.getElementById('receipt-list');
  let html = '';
  inventory.forEach(item=>{
    const qty = quantities[item.id];
    if(qty > 0){
      const lineTotal = item.price * qty;
      html += `
        <div class="flex items-center justify-between py-3 border-b border-[#222] last:border-0">
          <div class="flex items-center gap-3 sm:gap-4 w-1/2">
            <div style="width:26px;height:26px;flex-shrink:0;">${generateIcon(item)}</div>
            <span class="text-gray-200 leading-tight truncate">${item.name}</span>
          </div>
          <div class="w-1/6 text-right text-gray-500 font-bold">x${qty}</div>
          <div class="w-1/3 text-right price-font text-white font-bold tracking-wide">${formatShorthand(lineTotal)}</div>
        </div>`;
    }
  });
  list.innerHTML = html;
  document.getElementById('receipt-total').innerText = formatMoney(totalSpent);
}
function shareOnX(){
  const text = `I just dropped ${formatMoney(totalSpent)} on the Block Market! 💸 Try to beat my high score.`;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

// ==========================================
// 12. INIT
// ==========================================
document.getElementById('search-input').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('sort-select').addEventListener('change', (e)=>{
  sortMode = e.target.value;
  render();
});
render();
</script>

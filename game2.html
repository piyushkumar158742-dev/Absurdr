<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030303;
            --card-bg: rgba(18, 18, 18, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .item-card:hover {
    border-color: rgba(255, 255, 255, 0.22);
    transform: translateY(-4px);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.04);
    background: rgba(26, 26, 26, 0.88);
        }

        .icon-slot {
    width: 84px;
    height: 84px;
    margin: 0 auto 16px auto;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #171717 0%, #090909 75%);
    border: 1px solid #222;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -8px 14px rgba(0,0,0,0.45);
    position: relative;
    user-select: none;
    transition: all 0.3s ease;
}
@media (min-width: 640px) {
    .icon-slot { width: 92px; height: 92px; }
}

.pixel-canvas {
    width: 70px;
    height: 70px;
    image-rendering: pixelated; /* Ensures sharp pixels */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
        .item-card:hover .pixel-canvas { transform: scale(1.15) translateY(-2px); }

        .rarity-common .icon-slot { box-shadow: inset 0 0 15px rgba(255,255,255,0.03); border-color: #2a2a2a; }
        .rarity-uncommon .icon-slot { box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.25); }
        .rarity-rare .icon-slot { box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.35); }
        .rarity-epic .icon-slot { box-shadow: inset 0 0 25px rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.45); }
        .rarity-legendary .icon-slot { box-shadow: inset 0 0 30px rgba(245, 158, 11, 0.25); border-color: rgba(245, 158, 11, 0.5); }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #a3a3a3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.15s;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .ctrl-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.25); }

        .price-font { font-family: 'Space Grotesk', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>

        // End of Sprites

        // Voxel Rendering Engine for Blocks
        function drawIsoBlock(ctx, colors, texType) {
            const size = 16;
            const s = 2; // scale for 64x64 canvas
            const cx = 32;
            const cy = 20;

            const cTop = colors[0];
            const cLeft = colors[1];
            const cRight = colors[2];

            // Helper to draw slightly altered pixels for texture
            function shade(col, amt) {
                let useHash = col.startsWith('#');
                col = col.replace(/^#/, '');
                if(col.length === 3) col = col[0]+col[0]+col[1]+col[1]+col[2]+col[2];
                let num = parseInt(col,16);
                let r = (num >> 16) + amt;
                let b = ((num >> 8) & 0x00FF) + amt;
                let g = (num & 0x0000FF) + amt;
                let newColor = (g | (b << 8) | (r << 16)).toString(16);
                while(newColor.length<6) newColor = "0"+newColor;
                return (useHash?"#":"") + newColor;
            }

            function drawFace(face, color) {
                for(let u=0; u<size; u++) {
                    for(let v=0; v<size; v++) {
                        let finalColor = color;
                        
                        // Procedural texturing based on type
                        if(texType === 'dirt' || texType === 'cobble' || texType === 'solid') {
                            if(Math.random() > 0.5) finalColor = shade(color, texType==='cobble' ? (Math.random()>0.5?15:-15) : (Math.random()>0.5?8:-8));
                        } else if (texType === 'grass') {
                            if (face !== 'top' && v < 3 + Math.random()*2) finalColor = '#599834'; // Grass rim
                            else if (face !== 'top' && Math.random() > 0.5) finalColor = shade(color, 8);
                        } else if (texType === 'log') {
                            if(face === 'top') {
                                if(u===0||v===0||u===15||v===15) finalColor = shade(color, -20);
                                else if(u>2&&v>2&&u<13&&v<13) finalColor = shade(color, 15);
                            } else {
                                if(u%3===0) finalColor = shade(color, -10);
                            }
                        } else if (texType === 'planks') {
                            if(u%4===0 || v%4===0) finalColor = shade(color, -15);
                        } else if (texType === 'bricks') {
                            if(u%4===0 || (v%8===0)) finalColor = '#dddddd'; // mortar
                        } else if (texType === 'tnt') {
                            if(face !== 'top') {
                                if(u>4 && u<11) finalColor = '#ffffff';
                                if(u>6 && u<9) finalColor = '#000000'; // TNT label
                            } else {
                                if(Math.random()>0.7) finalColor = shade(color, 15);
                            }
                        }

                        let x, y, z;
                        if(face === 'top') { x=u; y=v; z=size; }
                        if(face === 'left') { x=size; y=u; z=v; }
                        if(face === 'right') { x=u; y=size; z=v; }

                        const sx = cx + (x - y) * 1.732 * (s/2);
                        const sy = cy + (x + y) * (s/2) - z * s;

                        ctx.fillStyle = finalColor;
                        if(face === 'top') {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+1.732*(s/2), sy+(s/2)); ctx.lineTo(sx, sy+s); ctx.lineTo(sx-1.732*(s/2), sy+(s/2)); ctx.fill();
                        } else if (face === 'left') {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx-1.732*(s/2), sy-(s/2)); ctx.lineTo(sx-1.732*(s/2), sy-(s/2)+s); ctx.lineTo(sx, sy+s); ctx.fill();
                        } else {
                            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+1.732*(s/2), sy-(s/2)); ctx.lineTo(sx+1.732*(s/2), sy-(s/2)+s); ctx.lineTo(sx, sy+s); ctx.fill();
                        }
                    }
                }
            }
            
            drawFace('top', cTop);
            drawFace('left', cLeft);
            drawFace('right', cRight);
        }

        function drawItemSprite(ctx, template, palette, scale) {
            const data = sprites[template];
            if(!data) return;
            const rows = data.split(',');
            for(let y=0; y<16; y++) {
                for(let x=0; x<16; x++) {
                    const char = rows[y][x];
                    if(char !== '0') {
                        ctx.fillStyle = palette[parseInt(char)];
                        ctx.fillRect(x*scale, y*scale, scale, scale);
                    }
                }
            }
        }

        // ==========================================
        // 3. UI RENDER ENGINE
        // ==========================================
        function initGrid() {
            const grid = document.getElementById('items-grid');
            inventory.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = `item-card rounded-[20px] p-4 sm:p-5 ${item.rarity}`;
                
                card.innerHTML = `
                <div class="icon-slot"><canvas id="canvas-${item.id}" width="70" height="70" class="pixel-canvas"></canvas></div>                    <div class="flex-grow flex flex-col items-center justify-start w-full">
                        <h3 class="text-sm sm:text-[15px] font-semibold text-center text-gray-200 leading-snug mb-2 w-full">${item.name}</h3>
                    </div>
                    <div class="mt-auto w-full pt-1">
                        <p class="text-white price-font text-center font-bold text-base sm:text-lg mb-3 tracking-wide opacity-90">${formatShorthand(item.price)}</p>
                        <div class="flex items-center justify-between w-full gap-1 sm:gap-2 bg-black/60 p-1 rounded-xl border border-white/10">
                            <button onclick="updateQty(${item.id}, -1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg transition-transform select-none">-</button>
                            <input type="number" id="input-${item.id}" value="0" min="0" 
                                class="bg-transparent text-center font-bold text-white w-full min-w-0 outline-none price-font text-sm sm:text-base px-0.5"
                                oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
                            <button onclick="updateQty(${item.id}, 1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg transition-transform select-none">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Stagger drawing to prevent lag
            setTimeout(() => {
                let idx = 0;
                function drawNextBatch() {
                    for(let i=0; i<5 && idx<inventory.length; i++, idx++) {
                        const item = inventory[idx];
                        const canvas = document.getElementById(`canvas-${item.id}`);
                        if(canvas) {
                            const ctx = canvas.getContext('2d');
                            if(item.type === 'block') {
                                drawIsoBlock(ctx, item.data, item.data[3]);
                            } else {
                                drawItemSprite(ctx, item.data[0], item.data, 4);
                            }
                        }
                    }
                    if(idx < inventory.length) requestAnimationFrame(drawNextBatch);
                }
                drawNextBatch();
            }, 100);
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            if (current > 9999999) current = 9999999;
            quantities[id] = current;
            
            const inputEl = document.getElementById(`input-${id}`);
            inputEl.value = current;
            inputEl.style.transform = 'scale(1.1)';
            setTimeout(() => inputEl.style.transform = 'scale(1)', 150);
            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            if (num > 9999999) num = 9999999;
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            inventory.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            document.getElementById('total-spent').innerText = totalSpent === 0 ? '$0.00' : formatShorthand(totalSpent);
            
            if (!document.getElementById('receipt-modal').classList.contains('hidden')) {
                buildReceipt();
            }
        }

        // ==========================================
        // 4. RECEIPT
        // ==========================================
        const modal = document.getElementById('receipt-modal');
        const modalContent = document.getElementById('receipt-content');

        function openReceipt() {
            if (totalSpent === 0) {
                alert("Your inventory cart is empty.");
                return;
            }
            buildReceipt();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeReceipt() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function buildReceipt() {
            const list = document.getElementById('receipt-list');
            list.innerHTML = '';
            
            inventory.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const lineTotal = item.price * qty;
                    const cId = `rcpt-canvas-${item.id}`;
                    list.innerHTML += `
                        <div class="flex items-center justify-between py-3 border-b border-[#222] last:border-0">
                            <div class="flex items-center gap-3 sm:gap-4 w-1/2">
                                <canvas id="${cId}" width="32" height="32" class="filter grayscale brightness-150" style="image-rendering:pixelated;"></canvas>
                                <span class="text-gray-200 leading-tight truncate">${item.name}</span>
                            </div>
                            <div class="w-1/6 text-right text-gray-500 font-bold">x${qty}</div>
                            <div class="w-1/3 text-right price-font text-white font-bold tracking-wide">${formatShorthand(lineTotal)}</div>
                        </div>
                    `;
                    
                    // Draw Mini version for receipt
                    setTimeout(() => {
                        const rCanvas = document.getElementById(cId);
                        if(rCanvas) {
                            const ctx = rCanvas.getContext('2d');
                            ctx.scale(0.5, 0.5); // scale down 64->32
                            if(item.type === 'block') drawIsoBlock(ctx, item.data, item.data[3]);
                            else drawItemSprite(ctx, item.data[0], item.data, 4);
                        }
                    }, 50);
                }
            });
            document.getElementById('receipt-total').innerText = formatMoney(totalSpent);
        }

        function shareOnX() {
            const text = `I just dropped ${formatMoney(totalSpent)} on the Block Market! 💸 Try to beat my high score.`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        initGrid();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Block Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #1d1d1d;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 32px 32px;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* UI Styling */
        .mc-slot {
            background-color: #8b8b8b;
            border: 4px solid;
            border-top-color: #e5e5e5;
            border-left-color: #e5e5e5;
            border-bottom-color: #373737;
            border-right-color: #373737;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .mc-button {
            background-color: #c6c6c6;
            border: 4px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-bottom-color: #555555;
            border-right-color: #555555;
            color: #222;
            transition: all 0.05s ease;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            cursor: pointer;
        }
        
        .mc-button:active {
            border-top-color: #555555;
            border-left-color: #555555;
            border-bottom-color: #ffffff;
            border-right-color: #ffffff;
            background-color: #a0a0a0;
        }

        .mc-button-green {
            background-color: #3db83d;
            border-top-color: #55ff55;
            border-left-color: #55ff55;
            border-bottom-color: #1a6b1a;
            border-right-color: #1a6b1a;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .mc-button-green:active {
            border-top-color: #1a6b1a;
            border-left-color: #1a6b1a;
            border-bottom-color: #55ff55;
            border-right-color: #55ff55;
            background-color: #2e8f2e;
        }

        .mc-input {
            background-color: #1e1e1e;
            border: 4px solid;
            border-top-color: #000000;
            border-left-color: #000000;
            border-bottom-color: #555555;
            border-right-color: #555555;
            color: #fff;
            width: 100%;
            min-width: 0; /* Prevents flex flex-grow breakout */
        }

        /* Hide number arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .mc-text-shadow {
            text-shadow: 2px 2px 0px #3f3f3f;
        }

        .receipt-bg {
            background-color: #f6e5b4;
            color: #000;
            border: 4px solid #4a3525;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .sticky-header {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border-bottom: 4px solid #111;
        }

        /* -------------------------------------
           CSS ART 3D CUBE (NO IMAGE ICONS)
           ------------------------------------- */
        .cube-wrapper {
            width: 60px;
            height: 70px;
            position: relative;
            margin: 0 auto 15px auto;
            transform: scale(1.1);
        }
        .cube {
            width: 40px;
            height: 40px;
            position: absolute;
            top: 15px;
            left: 10px;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(45deg);
        }
        .face {
            position: absolute;
            width: 40px;
            height: 40px;
        }
        .top-face { transform: rotateX(90deg) translateZ(20px); }
        .front-face { transform: translateZ(20px); }
        .right-face { transform: rotateY(90deg) translateZ(20px); }
        
        .cube-texture {
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
            /* Procedural pixelation overlay */
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%),
                linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
        }
        
        /* Highlight overlay to give block edges depth */
        .front-face .cube-texture { box-shadow: inset 2px -2px 4px rgba(0,0,0,0.3); }
        .right-face .cube-texture { box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4); }
        .top-face .cube-texture { box-shadow: inset 2px 2px 4px rgba(255,255,255,0.2); }
    </style>
</head>
<body class="pb-20">

    <!-- Top Branding -->
    <nav class="bg-black py-4 px-6 text-3xl text-center text-gray-300 tracking-widest border-b-4 border-gray-700 mc-text-shadow">
        THE BLOCK MARKET
    </nav>

    <!-- Sticky Header -->
    <div class="sticky-header text-center py-6 sticky top-0 z-50 shadow-2xl flex flex-col items-center">
        <h2 class="text-2xl text-gray-400 mb-1">EMERALDS SPENT</h2>
        <div class="text-5xl sm:text-7xl font-bold text-[#55ff55] mc-text-shadow flex items-center justify-center gap-4 mb-4" id="total-spent">
            <span class="text-4xl">🟢</span> 0
        </div>
        <button onclick="generateReceipt()" class="mc-button mc-button-green font-bold text-2xl py-2 px-8 tracking-widest">
            MAKE RECEIPT
        </button>
    </div>

    <!-- Main Content -->
    <div class="max-w-[1400px] mx-auto px-4 py-10">
        
        <!-- Items Grid -->
        <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Injected by JS -->
        </div>

        <!-- Receipt Section -->
        <div id="receipt-container" class="mt-16 receipt-bg max-w-3xl mx-auto py-10 px-6 sm:px-16 hidden">
            <h2 class="text-4xl font-bold text-center mb-8 border-b-4 border-dotted border-gray-800 pb-4">TRADE RECEIPT</h2>
            
            <div id="receipt-items" class="flex flex-col gap-2 mb-6 text-xl sm:text-2xl overflow-hidden">
                <!-- Receipt rows -->
            </div>
            
            <div class="flex justify-between border-t-4 border-black pt-4 font-bold text-3xl mt-6">
                <span>TOTAL:</span>
                <span id="receipt-total" class="text-green-800 flex items-center gap-2 truncate pl-2">🟢 0</span>
            </div>
        </div>
    </div>

    <script>
        // Generating 120+ Custom CSS Blocks
        const items = [];
        let idCounter = 1;

        // Helper to register blocks dynamically with calculated prices
        function addBlock(name, price, topHex, frontHex, rightHex, opacity = 1) {
            items.push({ id: idCounter++, name, price, top: topHex, front: frontHex, right: rightHex, opacity });
        }

        // ==========================================
        // 1. Natural Blocks
        // ==========================================
        addBlock("Dirt Block", 1, "#866043", "#714f35", "#5c402a");
        addBlock("Grass Block", 2, "#659b40", "#714f35", "#5c402a");
        addBlock("Cobblestone", 2, "#6c6c6c", "#5b5b5b", "#4a4a4a");
        addBlock("Stone Block", 3, "#7d7d7d", "#6c6c6c", "#5b5b5b");
        addBlock("Sand", 2, "#dbd3a0", "#c2bb8d", "#a8a27a");
        addBlock("Gravel", 2, "#827f7f", "#6e6b6b", "#595757");
        addBlock("Bedrock", 9999999, "#3a3a3a", "#292929", "#1a1a1a");
        addBlock("Obsidian", 100, "#201830", "#151020", "#0d0a14");
        addBlock("Glass Block", 5, "#c2e1e3", "#a9c6c8", "#90abad", 0.5);
        addBlock("Leaves Block", 1, "#4a7428", "#3a5c1e", "#2a4515", 0.9);
        addBlock("Sponge Block", 50, "#d1c93a", "#b5ad2c", "#969022");
        addBlock("Slime Block", 300, "#73c944", "#5eb033", "#4a9622", 0.7);
        addBlock("Honey Block", 350, "#f4a21a", "#db8f11", "#c27c09", 0.8);
        addBlock("Magma Block", 80, "#8f3414", "#75280e", "#5c1e09");
        addBlock("Soul Sand", 90, "#544033", "#423228", "#33261f");
        addBlock("Glowstone", 150, "#cca445", "#b38f3a", "#96772e");
        addBlock("Sea Lantern", 200, "#d1e8e8", "#b6d1d1", "#9cbaba");
        addBlock("Ice Block", 10, "#8eb5db", "#799bc2", "#6584a8", 0.6);
        addBlock("Snow Block", 4, "#ffffff", "#e0e0e0", "#c4c4c4");
        addBlock("Clay Block", 12, "#a0a6b3", "#898e99", "#727782");

        // ==========================================
        // 2. Ores & Precious Blocks (Prices Calculated: Ingot Price * 9)
        // ==========================================
        // Iron Ingot = 50 -> Block = 450
        addBlock("Iron Block", 450, "#e5e5e5", "#cecece", "#b7b7b7");
        // Gold Ingot = 200 -> Block = 1800
        addBlock("Gold Block", 1800, "#fbee51", "#e4d848", "#ccc03f");
        // Diamond = 1000 -> Block = 9000
        addBlock("Diamond Block", 9000, "#70ffeb", "#5be5d3", "#47ccba");
        // Emerald = 500 -> Block = 4500
        addBlock("Emerald Block", 4500, "#41f574", "#32de62", "#25c752");
        // Netherite = 25000 -> Block = 225000
        addBlock("Netherite Block", 225000, "#443f41", "#363234", "#282526");
        addBlock("Coal Block", 90, "#161616", "#101010", "#0a0a0a");
        addBlock("Redstone Block", 270, "#a41600", "#8a1100", "#700d00");
        addBlock("Lapis Block", 135, "#1d4493", "#163678", "#0f285c");
        addBlock("Amethyst Block", 1600, "#8a66a7", "#75568f", "#5f4577");
        addBlock("Copper Block", 360, "#c16b47", "#a65b3c", "#8c4b30");
        addBlock("Quartz Block", 320, "#eeebe6", "#d1cdca", "#b5b1ad");
        addBlock("Ancient Debris", 5000, "#5e4337", "#4a342a", "#38261e");
        addBlock("Bone Block", 40, "#e3ded1", "#c9c4b7", "#ada799");
        addBlock("Raw Iron Block", 225, "#d8af93", "#c29c82", "#a8866f");
        addBlock("Raw Gold Block", 900, "#f4c633", "#d6ac29", "#b89320");
        addBlock("Raw Copper Block", 180, "#c87652", "#af6545", "#965538");

        // ==========================================
        // 3. Wood Types (Logs & Planks)
        // ==========================================
        const woods = [
            { n: "Oak", logT: "#b38f55", logS: "#4d3d24", p: "#b38f55" },
            { n: "Birch", logT: "#c8b47a", logS: "#e1e0db", p: "#d5c38c" },
            { n: "Spruce", logT: "#725330", logS: "#352413", p: "#725330" },
            { n: "Jungle", logT: "#9c6a46", logS: "#533f27", p: "#a2704b" },
            { n: "Acacia", logT: "#a85c32", logS: "#5c554e", p: "#a65c32" },
            { n: "Dark Oak", logT: "#432b13", logS: "#271b0d", p: "#432b13" }
        ];
        woods.forEach(w => {
            // Logs = 4
            addBlock(w.n + " Log", 4, w.logT, w.logS, w.logS);
            // Planks = 1
            addBlock(w.n + " Plank", 1, w.p, adjustColor(w.p, -20), adjustColor(w.p, -40));
        });

        // ==========================================
        // 4. Colored Blocks Generator (Wool, Concrete, Glass)
        // ==========================================
        const colors = [
            { name: "White", hex: "#e4e4e4" }, { name: "Orange", hex: "#ea7e35" },
            { name: "Magenta", hex: "#be49c9" }, { name: "Light Blue", hex: "#6387d2" },
            { name: "Yellow", hex: "#f1af15" }, { name: "Lime", hex: "#7abc2f" },
            { name: "Pink", hex: "#e98cac" }, { name: "Gray", hex: "#424242" },
            { name: "Light Gray", hex: "#8e8e86" }, { name: "Cyan", hex: "#16878c" },
            { name: "Purple", hex: "#7a2aac" }, { name: "Blue", hex: "#35399d" },
            { name: "Brown", hex: "#724728" }, { name: "Green", hex: "#546d1b" },
            { name: "Red", hex: "#a12722" }, { name: "Black", hex: "#141519" }
        ];

        // Add Wools (Price 15)
        colors.forEach(c => addBlock(c.name + " Wool", 15, c.hex, adjustColor(c.hex, -15), adjustColor(c.hex, -30)));
        // Add Concretes (Price 20)
        colors.forEach(c => addBlock(c.name + " Concrete", 20, c.hex, adjustColor(c.hex, -20), adjustColor(c.hex, -40)));
        // Add Stained Glass (Price 8)
        colors.forEach(c => addBlock(c.name + " Glass", 8, c.hex, adjustColor(c.hex, -15), adjustColor(c.hex, -30), 0.6));
        
        // Add a few technical blocks
        addBlock("TNT Block", 500, "#c23a2a", "#d73b2a", "#b82e1e");
        addBlock("Bookshelf", 120, "#b38f55", "#8c2020", "#2c6c30"); // abstract representation
        addBlock("End Stone", 10, "#dfdf9f", "#c4c489", "#a8a873");
        addBlock("Purpur Block", 25, "#a573a5", "#8f608f", "#784d78");

        // Simple helper to darken hex colors for block shading
        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        let quantities = {};
        let totalSpent = 0;

        function formatAbbreviated(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(num % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'K';
            return num;
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            
            items.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = "mc-slot p-3 flex flex-col items-center justify-between min-w-0";
                
                // CSS Art Generation
                const blockHTML = `
                    <div class="cube-wrapper">
                        <div class="cube" style="opacity: ${item.opacity};">
                            <div class="face top-face" style="background-color: ${item.top};">
                                <div class="cube-texture"></div>
                            </div>
                            <div class="face front-face" style="background-color: ${item.front};">
                                <div class="cube-texture"></div>
                            </div>
                            <div class="face right-face" style="background-color: ${item.right};">
                                <div class="cube-texture"></div>
                            </div>
                        </div>
                    </div>
                `;

                card.innerHTML = `
                    ${blockHTML}
                    <h3 class="text-lg text-white mt-2 text-center leading-tight mc-text-shadow line-clamp-2 h-12 flex items-center justify-center w-full px-1 break-words">${item.name}</h3>
                    <p class="text-[#55ff55] text-xl mc-text-shadow mb-3">🟢 ${formatAbbreviated(item.price)}</p>
                    
                    <div class="flex items-center gap-1 w-full mt-auto">
                        <button onclick="updateQty(${item.id}, -1)" class="mc-button text-xl py-1 px-2 text-center select-none shrink-0">
                            -
                        </button>
                        
                        <!-- maxlength logic applied via JS oninput to prevent breaking layout -->
                        <div class="flex-1 min-w-0">
                            <input type="number" id="input-${item.id}" value="0" min="0" 
                                class="mc-input text-center text-xl py-1 outline-none"
                                oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
                        </div>
                        
                        <button onclick="updateQty(${item.id}, 1)" class="mc-button text-xl py-1 px-2 text-center select-none shrink-0">
                            +
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            if (current > 9999999) current = 9999999;
            
            quantities[id] = current;
            document.getElementById(`input-${id}`).value = current;
            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            if (num > 9999999) num = 9999999; // Hard cap so numbers fit
            
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            items.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            
            document.getElementById('total-spent').innerHTML = `<span class="text-4xl sm:text-6xl">🟢</span> ${formatNumber(totalSpent)}`;
            
            // Only update receipt silently if it's already visible
            if (!document.getElementById('receipt-container').classList.contains('hidden')) {
                updateReceiptHTML();
            }
        }

        function generateReceipt() {
            const container = document.getElementById('receipt-container');
            if (totalSpent === 0) {
                alert("You need to buy some blocks first!");
                return;
            }
            
            container.classList.remove('hidden');
            updateReceiptHTML();
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateReceiptHTML() {
            const receiptDiv = document.getElementById('receipt-items');
            receiptDiv.innerHTML = '';
            
            items.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const itemTotal = item.price * qty;
                    receiptDiv.innerHTML += `
                        <div class="flex justify-between items-center py-1 border-b border-dashed border-gray-400 last:border-0">
                            <div class="w-[45%] text-left pr-2 truncate" title="${item.name}">${item.name}</div>
                            <div class="w-[20%] text-left shrink-0">x${formatAbbreviated(qty)}</div>
                            <div class="w-[35%] text-right font-bold text-green-900 truncate">🟢 ${formatAbbreviated(itemTotal)}</div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('receipt-total').innerHTML = `🟢 ${formatNumber(totalSpent)}`;
        }

        // Initialize App
        renderGrid();
    </script>
</body>
</html>

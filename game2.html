<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Block Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
        }

        /* Custom Scrollbar for Premium Look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Hide Number Input Arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* Premium Item Card Styling */
        .item-card {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .item-card:hover {
            border-color: #10b981;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.15);
        }

        .icon-2d {
            font-size: 3.5rem;
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            user-select: none;
        }

        .ctrl-btn {
            background: #334155;
            color: #cbd5e1;
            transition: all 0.15s;
        }
        .ctrl-btn:hover { background: #475569; color: #fff; }
        .ctrl-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="pt-20 pb-12 antialiased">

    <!-- Slim Premium Sticky Header -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-slate-900/85 backdrop-blur-md border-b border-slate-800 z-50 flex items-center justify-between px-4 sm:px-8 shadow-lg">
        <div class="hidden sm:block font-black tracking-widest text-slate-400 text-sm uppercase">The Market</div>
        
        <!-- Live Total -->
        <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center">
            <span class="text-emerald-500 font-black text-2xl sm:text-3xl tracking-tight" id="total-spent">$0</span>
        </div>

        <button onclick="openReceipt()" class="bg-gradient-to-r from-emerald-500 to-emerald-400 hover:from-emerald-400 hover:to-emerald-300 text-slate-900 font-bold py-2 px-5 rounded-lg text-sm transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] active:scale-95 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="hidden sm:inline">Make Receipt</span>
            <span class="sm:hidden">Receipt</span>
        </button>
    </header>

    <!-- Main Grid -->
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6">
        <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4">
            <!-- Injected dynamically by JavaScript -->
        </div>
    </div>

    <!-- Receipt Modal Overlay -->
    <div id="receipt-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center opacity-0 transition-opacity duration-300 backdrop-blur-sm p-4">
        
        <div id="receipt-content" class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg flex flex-col relative shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh]">
            
            <!-- Top Right Close (X) Icon -->
            <button onclick="closeReceipt()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-slate-700 z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Receipt Header -->
            <div class="p-6 border-b border-slate-700 pt-8">
                <h2 class="text-2xl font-black text-white uppercase tracking-wider">Official Receipt</h2>
                <p class="text-slate-400 text-sm mt-1">Transaction Details</p>
            </div>
            
            <!-- Receipt Items List -->
            <div id="receipt-list" class="p-6 overflow-y-auto flex-1 space-y-3 font-medium text-slate-300">
                <!-- Rows injected here -->
            </div>
            
            <!-- Receipt Footer & Share -->
            <div class="p-6 border-t border-slate-700 bg-slate-900/50 rounded-b-2xl">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-lg text-slate-400 uppercase font-bold tracking-wider">Total Due</span>
                    <span class="text-3xl font-black text-emerald-400" id="receipt-total">$0</span>
                </div>
                
                <button onclick="shareOnX()" class="w-full bg-black hover:bg-zinc-900 border border-zinc-800 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-colors shadow-lg active:scale-[0.98]">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    Share on 𝕏
                </button>
            </div>
        </div>
    </div>

    <script>
        const inventory = [];
        let idCounter = 1;

        // Generate ~100 Blocks & ~100 Items Dynamically
        function addEntity(name, price, icon) {
            inventory.push({ id: idCounter++, name, price, icon });
        }

        // ==========================================
        // GENERATE 102 BLOCKS
        // ==========================================
        const blockBasics = [
            {n: 'Dirt Block', p: 1, i: '🟫'}, {n: 'Stone Block', p: 3, i: '🪨'}, {n: 'Cobblestone', p: 2, i: '🌑'},
            {n: 'Sand Block', p: 2, i: '🏖️'}, {n: 'Gravel Block', p: 2, i: '🪨'}, {n: 'Obsidian', p: 100, i: '⬛'},
            {n: 'Bedrock', p: 999999, i: '🕳️'}, {n: 'Coal Block', p: 90, i: '⬛'},
            {n: 'Iron Block', p: 450, i: '⬜'}, {n: 'Gold Block', p: 1800, i: '🟨'},
            {n: 'Diamond Block', p: 9000, i: '💠'}, {n: 'Emerald Block', p: 4500, i: '🟩'},
            {n: 'Netherite Block', p: 225000, i: '🔲'}, {n: 'Slime Block', p: 300, i: '🟩'},
            {n: 'Honey Block', p: 350, i: '🍯'}, {n: 'Magma Block', p: 80, i: '🌋'},
            {n: 'Soul Sand', p: 90, i: '👻'}, {n: 'Glowstone', p: 150, i: '💡'},
            {n: 'Sea Lantern', p: 200, i: '🏮'}, {n: 'Sponge', p: 50, i: '🧽'},
            {n: 'End Stone', p: 25, i: '🌕'}, {n: 'Purpur Block', p: 40, i: '🟪'},
            {n: 'Basalt', p: 15, i: '🪨'}, {n: 'Blackstone', p: 15, i: '⬛'},
            {n: 'Prismarine', p: 120, i: '🌊'}, {n: 'Netherrack', p: 2, i: '🟥'}
        ];
        blockBasics.forEach(b => addEntity(b.n, b.p, b.i)); // 26 Basic/Ore Blocks

        const woods = ['Oak', 'Spruce', 'Birch', 'Jungle', 'Acacia', 'Dark Oak'];
        woods.forEach(w => {
            addEntity(`${w} Log`, 5, '🪵');
            addEntity(`${w} Planks`, 1, '🟫');
            addEntity(`${w} Leaves`, 2, '🌿');
        }); // 18 Wood Blocks

        const colors = ['White', 'Light Gray', 'Gray', 'Black', 'Brown', 'Red', 'Orange', 'Yellow', 'Lime', 'Green', 'Cyan', 'Light Blue', 'Blue', 'Purple', 'Magenta', 'Pink'];
        colors.forEach(c => {
            addEntity(`${c} Wool`, 10, '🐑');
            addEntity(`${c} Concrete`, 15, '🧱');
            addEntity(`${c} Glass`, 12, '🧊');
            addEntity(`${c} Terracotta`, 14, '🏺');
        }); // 64 Color Blocks
        // Total Blocks = 108

        // ==========================================
        // GENERATE 104 ITEMS
        // ==========================================
        const tiers = [
            { t: 'Wooden', p: 10 }, { t: 'Stone', p: 25 },
            { t: 'Iron', p: 150 }, { t: 'Golden', p: 500 },
            { t: 'Diamond', p: 2500 }, { t: 'Netherite', p: 25000 }
        ];
        const gear = ['Sword', 'Pickaxe', 'Axe', 'Shovel', 'Hoe', 'Helmet', 'Chestplate', 'Leggings', 'Boots'];
        tiers.forEach(tier => {
            gear.forEach(g => {
                let icon = '🗡️';
                if(g==='Pickaxe') icon = '⛏️'; if(g==='Axe') icon = '🪓';
                if(g==='Shovel') icon = '🥄'; if(g==='Hoe') icon = '🦯';
                if(g==='Helmet') icon = '🪖'; if(g==='Chestplate') icon = '👕';
                if(g==='Leggings') icon = '👖'; if(g==='Boots') icon = '🥾';
                let multiplier = (g==='Chestplate'?8:g==='Leggings'?7:g==='Helmet'||g==='Boots'?4:3);
                addEntity(`${tier.t} ${g}`, tier.p * multiplier, icon);
            });
        }); // 54 Gear Items

        const foods = [
            {n: 'Apple', p: 5, i: '🍎'}, {n: 'Bread', p: 15, i: '🍞'},
            {n: 'Cooked Porkchop', p: 25, i: '🍖'}, {n: 'Cooked Beef', p: 25, i: '🥩'},
            {n: 'Golden Apple', p: 500, i: '🍏'}, {n: 'Enchanted Apple', p: 10000, i: '🍎✨'},
            {n: 'Carrot', p: 5, i: '🥕'}, {n: 'Potato', p: 5, i: '🥔'},
            {n: 'Baked Potato', p: 15, i: '🥔🔥'}, {n: 'Cookie', p: 10, i: '🍪'},
            {n: 'Cake', p: 150, i: '🎂'}, {n: 'Pumpkin Pie', p: 50, i: '🥧'},
            {n: 'Mushroom Stew', p: 30, i: '🥣'}, {n: 'Suspicious Stew', p: 50, i: '🍲'},
            {n: 'Sweet Berries', p: 5, i: '🍓'}, {n: 'Glow Berries', p: 10, i: '🟡'},
            {n: 'Melon Slice', p: 5, i: '🍉'}, {n: 'Chorus Fruit', p: 100, i: '🍇'},
            {n: 'Spider Eye', p: 20, i: '👁️'}, {n: 'Rotten Flesh', p: 2, i: '🧟'}
        ];
        foods.forEach(f => addEntity(f.n, f.p, f.i)); // 20 Food Items

        const materials = [
            {n: 'Coal', p: 10, i: '🪨'}, {n: 'Raw Iron', p: 25, i: '🪙'},
            {n: 'Iron Ingot', p: 50, i: '🔩'}, {n: 'Raw Gold', p: 100, i: '🟡'},
            {n: 'Gold Ingot', p: 200, i: '🥇'}, {n: 'Diamond', p: 1000, i: '💎'},
            {n: 'Emerald', p: 500, i: '🟢'}, {n: 'Netherite Scrap', p: 8000, i: '⚙️'},
            {n: 'Netherite Ingot', p: 25000, i: '⬛✨'}, {n: 'Lapis Lazuli', p: 15, i: '🔷'},
            {n: 'Redstone Dust', p: 30, i: '🔴'}, {n: 'Copper Ingot', p: 40, i: '🥉'},
            {n: 'Amethyst Shard', p: 400, i: '💜'}, {n: 'Quartz', p: 80, i: '🤍'},
            {n: 'Stick', p: 1, i: '🦯'}, {n: 'String', p: 5, i: '🧵'},
            {n: 'Feather', p: 5, i: '🪶'}, {n: 'Gunpowder', p: 50, i: '🧨'},
            {n: 'Leather', p: 15, i: '👞'}, {n: 'Flint', p: 10, i: '🪨'},
            {n: 'Ender Pearl', p: 500, i: '🔮'}, {n: 'Eye of Ender', p: 1200, i: '👁️‍🗨️'},
            {n: 'Totem of Undying', p: 25000, i: '🏺'}, {n: 'Elytra', p: 75000, i: '🦋'},
            {n: 'Saddle', p: 1500, i: '💺'}, {n: 'Nametag', p: 1000, i: '🏷️'},
            {n: 'Bow', p: 200, i: '🏹'}, {n: 'Arrow', p: 5, i: '↗️'},
            {n: 'Trident', p: 15000, i: '🔱'}, {n: 'Shield', p: 300, i: '🛡️'}
        ];
        materials.forEach(m => addEntity(m.n, m.p, m.i)); // 30 Material Items
        // Total Items = 104

        // ==========================================
        // LOGIC & RENDERING
        // ==========================================
        const quantities = {};
        let totalSpent = 0;

        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function formatShorthand(num) {
            if (num >= 1e12) return '$' + (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(num % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'K';
            return '$' + num;
        }

        function initGrid() {
            const grid = document.getElementById('items-grid');
            inventory.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = "item-card rounded-xl p-4 flex flex-col items-center justify-between min-h-[220px]";
                
                card.innerHTML = `
                    <div class="icon-2d mb-3">${item.icon}</div>
                    <h3 class="text-sm sm:text-base font-bold text-center leading-tight line-clamp-2 h-10 w-full mb-1">${item.name}</h3>
                    <p class="text-emerald-400 font-mono font-bold mb-4">${formatShorthand(item.price)}</p>
                    
                    <div class="flex items-center w-full gap-1 bg-slate-900/80 p-1 rounded-lg border border-slate-700/50">
                        <button onclick="updateQty(${item.id}, -1)" class="ctrl-btn w-8 h-8 rounded flex items-center justify-center font-bold shrink-0">-</button>
                        <input type="number" id="input-${item.id}" value="0" min="0" 
                            class="bg-transparent text-center font-bold text-white w-full outline-none"
                            oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
                        <button onclick="updateQty(${item.id}, 1)" class="ctrl-btn w-8 h-8 rounded flex items-center justify-center font-bold shrink-0">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            if (current > 9999999) current = 9999999;
            quantities[id] = current;
            document.getElementById(`input-${id}`).value = current;
            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            if (num > 9999999) num = 9999999;
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            inventory.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            document.getElementById('total-spent').innerText = formatShorthand(totalSpent);
            
            // Live update receipt if it's currently open
            if (!document.getElementById('receipt-modal').classList.contains('hidden')) {
                buildReceipt();
            }
        }

        // ==========================================
        // MODAL & RECEIPT LOGIC
        // ==========================================
        const modal = document.getElementById('receipt-modal');
        const modalContent = document.getElementById('receipt-content');

        function openReceipt() {
            if (totalSpent === 0) {
                alert("Cart is empty! Add some blocks or items first.");
                return;
            }
            buildReceipt();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Animate in
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeReceipt() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function buildReceipt() {
            const list = document.getElementById('receipt-list');
            list.innerHTML = '';
            
            inventory.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const lineTotal = item.price * qty;
                    list.innerHTML += `
                        <div class="flex items-center justify-between py-2 border-b border-slate-700/50 last:border-0">
                            <div class="flex items-center gap-3 w-1/2 overflow-hidden">
                                <span class="text-xl filter grayscale drop-shadow-md">${item.icon}</span>
                                <span class="truncate">${item.name}</span>
                            </div>
                            <div class="w-1/6 text-right text-slate-500">x${qty}</div>
                            <div class="w-1/3 text-right font-mono text-emerald-400 font-bold">${formatShorthand(lineTotal)}</div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('receipt-total').innerText = formatMoney(totalSpent);
        }

        function shareOnX() {
            const text = `I just spent ${formatMoney(totalSpent)} on Premium Blocks & Items! 💸 Can you beat my high score?`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Run Initialization
        initGrid();
    </script>
</body>
</html>

<style>
:root {
  --bg: #05070a;
  --surface: rgba(17,19,25,0.65);
  --surface-hover: rgba(24,27,35,0.9);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.25);
  --text: #eef1f6;
  --emerald: #34d97a;
  --font-display: 'Outfit', sans-serif;
  --font-mono: 'Space Grotesk', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-display);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 10% 15%, rgba(52,217,122,0.05) 0%, transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(91,140,255,0.05) 0%, transparent 40%),
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
  background-attachment: fixed;
  color: var(--text);
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #2a2d35; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3c4050; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

.price-font { font-family: var(--font-mono); }
.gradient-text {
  background: linear-gradient(135deg, #34d97a 0%, #5b8cff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.delta-toast {
  position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem;
  pointer-events: none; animation: floatUp 0.8s ease-out forwards; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
.delta-pos { color: var(--emerald); }
.delta-neg { color: #ff6767; }
@keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -24px); } }

/* Cards & Grid */
.item-card {
  background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; position: relative; overflow: hidden;
}
.item-card:hover {
  border-color: var(--border-hover); transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(0,0,0,0.6); background: var(--surface-hover);
}

.icon-slot {
  width: 76px; height: 76px; margin: 6px auto 14px auto; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: #0a0a0c; border: 1px solid #1e1e22; position: relative; user-select: none;
  transition: all 0.3s ease; perspective: 400px;
}
@media(min-width:640px) { .icon-slot { width: 84px; height: 84px; } }

.pixel-canvas {
  width: 58px; height: 58px; image-rendering: pixelated;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7)); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@media(min-width:640px) { .pixel-canvas { width: 64px; height: 64px; } }
.item-card:hover .pixel-canvas { transform: scale(1.15) rotate(2deg); }
.item-card:hover .iso-canvas { transform: scale(1.15) rotateY(10deg); }

.rarity-badge {
  position: absolute; top: 8px; left: 8px; font-family: 'Press Start 2P', monospace; font-size: 6.5px;
  padding: 4px 6px; border-radius: 5px; z-index: 2; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12);
}
.rarity-common .rarity-badge { color: #9aa1ad; } .rarity-common .icon-slot { box-shadow: inset 0 0 15px rgba(255,255,255,0.03); border-color: #242429; }
.rarity-uncommon .rarity-badge { color: #34d97a; } .rarity-uncommon .icon-slot { box-shadow: inset 0 0 18px rgba(52,217,122,0.12); border-color: rgba(52,217,122,0.28); }
.rarity-rare .rarity-badge { color: #5b8cff; } .rarity-rare .icon-slot { box-shadow: inset 0 0 18px rgba(91,140,255,0.16); border-color: rgba(91,140,255,0.35); }
.rarity-epic .rarity-badge { color: #b18cfb; } .rarity-epic .icon-slot { box-shadow: inset 0 0 22px rgba(177,140,251,0.2); border-color: rgba(177,140,251,0.45); }
.rarity-legendary .rarity-badge { color: #f6b93b; } .rarity-legendary .icon-slot { box-shadow: inset 0 0 26px rgba(246,185,59,0.24); border-color: rgba(246,185,59,0.55); }

.ctrl-btn { background: rgba(255,255,255,0.05); color: #a3a3a3; border: 1px solid rgba(255,255,255,0.1); transition: all 0.15s; }
.ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.ctrl-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
</style>

  <div class="w-1/3 sm:w-1/4 flex justify-end">
    <button onclick="openReceipt()" class="bg-white text-black hover:bg-gray-200 font-bold py-2.5 px-4 sm:px-7 rounded-full text-sm transition-all shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.25)] active:scale-95 flex items-center gap-2">
      <svg class="w-4 h-4 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Receipt</span>
    </button>
  </div>
</header>

<!-- Main Grid: Drops to 1 column on < 450px -->
<div class="max-w-[1400px] mx-auto px-3 sm:px-6">
  <div id="items-grid" class="grid grid-cols-1 min-[450px]:grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 items-stretch"></div>
</div>

<!-- Receipt Modal -->
<div id="receipt-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center opacity-0 transition-opacity duration-300 backdrop-blur-md p-4">
  <div id="receipt-content" class="bg-[#0a0a0a] border border-[#222] rounded-3xl w-full max-w-xl flex flex-col relative shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh]">
    <button onclick="closeReceipt()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors bg-[#111] hover:bg-[#222] p-2 rounded-full z-10 border border-[#222]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="p-6 sm:p-8 border-b border-[#1f1f1f] text-center">
      <h2 class="text-2xl sm:text-3xl font-black text-white tracking-widest uppercase">Block Market</h2>
      <p class="text-gray-500 text-xs sm:text-sm mt-2 font-mono uppercase tracking-widest">Official Transaction Receipt</p>
    </div>
    <div id="receipt-list" class="p-6 sm:p-8 overflow-y-auto flex-1 space-y-3 font-medium text-gray-300 text-sm sm:text-base"></div>
    <div class="p-6 sm:p-8 border-t border-[#1f1f1f] bg-[#050505] rounded-b-3xl">
      <div class="flex justify-between items-center mb-6 sm:mb-8">

        <span class="text-3xl sm:text-4xl font-black text-white price-font" id="receipt-total">$0.00</span>

    </div>

</div>

const inventory = rawData.map((row, i) => {
  const [name, price, dataKey] = row;
  const itemDef = itemData[dataKey];
  
  let rarityCls = 'rarity-common';
  if (price >= 1000000) rarityCls = 'rarity-legendary';
  else if (price >= 25000) rarityCls = 'rarity-epic';
  else if (price >= 1000) rarityCls = 'rarity-rare';
  else if (price >= 50) rarityCls = 'rarity-uncommon';

  return { id: i + 1, name, price, type: itemDef[0], data: itemDef, rarity: rarityCls };
});

const quantities = {};
inventory.forEach(it => quantities[it.id] = 0);
let totalSpent = 0;
let displayedTotal = 0;

// ==========================================
// 3. CANVAS RENDERER
// ==========================================
function shade(col, amt) {
  let useHash = col.startsWith('#');
  col = col.replace(/^#/, '');
  if(col.length === 3) col = col[0]+col[0]+col[1]+col[1]+col[2]+col[2];
  let num = parseInt(col,16);
  let r = (num >> 16) + amt, b = ((num >> 8) & 0x00FF) + amt, g = (num & 0x0000FF) + amt;
  r = r<255?r<0?0:r:255; b = b<255?b<0?0:b:255; g = g<255?g<0?0:g:255;
  let newColor = (g | (b << 8) | (r << 16)).toString(16);
  while(newColor.length<6) newColor = "0"+newColor;
  return (useHash?"#":"") + newColor;
}

function drawIsoBlock(ctx, colors, texType, sizeMultiplier = 1) {
  const size = 16;
  const s = 2.1 * sizeMultiplier;
  const cx = 32 * sizeMultiplier;
  const cy = 20 * sizeMultiplier;

  const [cTop, cLeft, cRight] = [colors[1], colors[2], colors[3]];

  function drawFace(face, color) {
    for(let u=0; u<size; u++) {
      for(let v=0; v<size; v++) {
        let finalColor = color;
        // Texturing based on type to make it look high-quality
        if(texType === 'dirt' || texType === 'cobble' || texType === 'solid') {
          if(Math.random() > 0.5) finalColor = shade(color, texType==='cobble' ? (Math.random()>0.5?15:-15) : (Math.random()>0.5?8:-8));
        } else if (texType === 'grass') {
          if (face !== 'top' && v < 3 + Math.random()*2) finalColor = '#599834';
          else if (face !== 'top' && Math.random() > 0.5) finalColor = shade(color, 8);
        } else if (texType === 'log') {
          if(face === 'top') {
            if(u===0||v===0||u===15||v===15) finalColor = shade(color, -20);
            else if(u>2&&v>2&&u<13&&v<13) finalColor = shade(color, 15);
          } else if(u%3===0) finalColor = shade(color, -10);
        } else if (texType === 'planks') {
          if(u%4===0 || v%4===0) finalColor = shade(color, -15);
        } else if (texType === 'bricks') {
          if(u%4===0 || (v%8===0)) finalColor = '#dddddd';
        } else if (texType === 'tnt') {
          if(face !== 'top') {
            if(u>4 && u<11) finalColor = '#ffffff';
            if(u>6 && u<9) finalColor = '#000000';
          } else if(Math.random()>0.7) finalColor = shade(color, 15);
        }

        let x, y, z;
        if(face === 'top') { x=u; y=v; z=size; }
        if(face === 'left') { x=size; y=u; z=v; }
        if(face === 'right') { x=u; y=size; z=v; }

        const sx = cx + (x - y) * 1.732 * (s/2);
        const sy = cy + (x + y) * (s/2) - z * s;

        ctx.fillStyle = finalColor;
        if(face === 'top') {
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+1.732*(s/2), sy+(s/2)); ctx.lineTo(sx, sy+s); ctx.lineTo(sx-1.732*(s/2), sy+(s/2)); ctx.fill();
        } else if (face === 'left') {
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx-1.732*(s/2), sy-(s/2)); ctx.lineTo(sx-1.732*(s/2), sy-(s/2)+s); ctx.lineTo(sx, sy+s); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+1.732*(s/2), sy-(s/2)); ctx.lineTo(sx+1.732*(s/2), sy-(s/2)+s); ctx.lineTo(sx, sy+s); ctx.fill();
        }
      }
    }
  }
  drawFace('top', cTop); drawFace('left', cLeft); drawFace('right', cRight);
}

function drawItemSprite(ctx, templateKey, colors, sizeMultiplier = 1) {
  const data = sprites[templateKey];
  if(!data) return;
  const rows = data.split(',');
  const scale = 3.6 * sizeMultiplier;
  const offset = 3.2 * sizeMultiplier; // center offset
  for(let y=0; y<16; y++) {
    for(let x=0; x<16; x++) {
      const char = rows[y][x];
      if(char !== '0') {
        ctx.fillStyle = colors[parseInt(char)];
        ctx.fillRect(offset + x*scale, offset + y*scale, scale, scale);
      }
    }
  }
}

// ==========================================
// 4. FORMATTING & LOGIC
// ==========================================
function formatMoney(amount) {
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(amount);
}

function formatShorthand(num) {
  if (num === 0) return "$0.00";
  if (num >= 1e12) return '$' + (num/1e12).toFixed(1).replace(/\.0$/,'') + 'T';
  if (num >= 1e9) return '$' + (num/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
  if (num >= 1e6) return '$' + (num/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (num >= 1e3) return '$' + (num/1e3).toFixed(num%1000===0?0:1).replace(/\.0$/,'') + 'K';
  if (num > 0 && num < 1) return '$' + num.toFixed(2);
  if (num % 1 !== 0) return '$' + num.toFixed(2);
  return '$' + num;
}

function renderGrid() {
  const grid = document.getElementById('items-grid');
  grid.innerHTML = inventory.map((item, idx) => {
    const qty = quantities[item.id] || 0;
    return `
    <div class="item-card rounded-[20px] p-4 sm:p-5 ${item.rarity}">
      <div class="icon-slot"><canvas id="cvs-${item.id}" width="64" height="64" class="${item.type==='block'?'iso-canvas':'pixel-canvas'}"></canvas></div>
      <div class="flex-grow flex flex-col items-center justify-start w-full">
        <h3 class="text-sm sm:text-base font-semibold text-center text-gray-200 leading-snug mb-2 w-full">${item.name}</h3>
      </div>
      <div class="mt-auto w-full pt-1">
        <p class="text-white price-font text-center font-bold text-base sm:text-lg mb-3 tracking-wide opacity-90">${formatShorthand(item.price)}</p>
        <div class="flex items-center justify-between w-full gap-1 sm:gap-2 bg-black/60 p-1 rounded-xl border border-white/10">
          <button onclick="updateQty(${item.id}, -1)" class="ctrl-btn w-8 h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg select-none">-</button>
          <input type="number" id="input-${item.id}" value="${qty}" min="0"
            class="bg-transparent text-center font-bold text-white w-full min-w-0 outline-none price-font text-base px-0.5"
            oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
          <button onclick="updateQty(${item.id}, 1)" class="ctrl-btn w-8 h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg select-none">+</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Stagger drawing to avoid freezing UI
  setTimeout(() => {
    inventory.forEach((item, i) => {
      setTimeout(() => {
        const cvs = document.getElementById(`cvs-${item.id}`);
        if(cvs) {
          const ctx = cvs.getContext('2d');
          if(item.type === 'block') drawIsoBlock(ctx, item.data, item.data[4]);
          else drawItemSprite(ctx, item.data[1], item.data);
        }
      }, i * 5);
    });
  }, 100);
}

function animateTotal(to) {
  const from = displayedTotal;
  const start = performance.now();
  const dur = 320;
  function step(t) {
    const p = Math.min(1, (t-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    displayedTotal = from + (to-from)*eased;
    document.getElementById('total-spent').textContent = displayedTotal < 0.005 ? '$0.00' : formatShorthand(displayedTotal);
    if(p < 1) requestAnimationFrame(step); else displayedTotal = to;
  }
  requestAnimationFrame(step);
}

function spawnDeltaToast(delta) {
  if(!delta) return;
  const wrap = document.getElementById('ticker-wrap');
  const el = document.createElement('span');
  el.className = 'delta-toast ' + (delta>0?'delta-pos':'delta-neg');
  el.textContent = (delta>0?'+':'-') + formatShorthand(Math.abs(delta));
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function calculateTotal() {
  let newTotal = 0;
  inventory.forEach(item => { newTotal += item.price * (quantities[item.id] || 0); });
  const delta = newTotal - totalSpent;
  totalSpent = newTotal;
  animateTotal(newTotal);
  spawnDeltaToast(delta);
  if(!document.getElementById('receipt-modal').classList.contains('hidden')) buildReceipt();
}

function updateQty(id, change) {
  let current = quantities[id] || 0;
  current += change;
  if(current < 0) current = 0;
  if(current > 9999999) current = 9999999;
  quantities[id] = current;
  const inputEl = document.getElementById(`input-${id}`);
  if(inputEl) {
    inputEl.value = current;
    inputEl.style.transform = 'scale(1.1)';
    setTimeout(()=>inputEl.style.transform='scale(1)', 150);
  }
  calculateTotal();
}

function manualUpdate(id, value) {
  let num = parseInt(value);
  if(isNaN(num) || num < 0) num = 0;
  if(num > 9999999) num = 9999999;
  quantities[id] = num;
  const el = document.getElementById(`input-${id}`);
  if(el) el.value = num;
  calculateTotal();
}

// ==========================================
// 5. RECEIPT MODAL
// ==========================================
const modal = document.getElementById('receipt-modal');
const modalContent = document.getElementById('receipt-content');

function openReceipt() {
  if(totalSpent === 0) { alert("Your cart is empty. Please add items."); return; }
  buildReceipt();
  modal.classList.remove('hidden'); modal.classList.add('flex');
  setTimeout(()=>{
    modal.classList.remove('opacity-0');
    modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100');
  }, 10);
}

function closeReceipt() {
  modal.classList.add('opacity-0');
  modalContent.classList.remove('scale-100'); modalContent.classList.add('scale-95');
  setTimeout(()=>{ modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
}

function buildReceipt() {
  const list = document.getElementById('receipt-list');
  let html = '';
  inventory.forEach(item => {
    const qty = quantities[item.id];
    if(qty > 0) {
      const lineTotal = item.price * qty;
      html += `
        <div class="flex items-center justify-between py-3 border-b border-[#222] last:border-0">
          <div class="flex items-center gap-3 sm:gap-4 w-1/2">
            <canvas id="rcpt-${item.id}" width="32" height="32" class="filter grayscale brightness-150" style="image-rendering:pixelated;"></canvas>
            <span class="text-gray-200 leading-tight truncate">${item.name}</span>
          </div>
          <div class="w-1/6 text-right text-gray-500 font-bold">x${qty}</div>
          <div class="w-1/3 text-right price-font text-white font-bold tracking-wide">${formatShorthand(lineTotal)}</div>
        </div>`;
    }
  });
  list.innerHTML = html;
  document.getElementById('receipt-total').innerText = formatMoney(totalSpent);

  // Draw tiny receipt canvases
  setTimeout(() => {
    inventory.forEach(item => {
      if(quantities[item.id] > 0) {
        const rc = document.getElementById(`rcpt-${item.id}`);
        if(rc) {
          const ctx = rc.getContext('2d');
          if(item.type === 'block') drawIsoBlock(ctx, item.data, item.data[4], 0.5);
          else drawItemSprite(ctx, item.data[1], item.data, 0.5);
        }
      }
    });
  }, 50);
}

function shareOnX() {
  const text = `I just dropped ${formatMoney(totalSpent)} on the Block Market! 💸 Can you beat my high score?`;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

// Initialize
renderGrid();

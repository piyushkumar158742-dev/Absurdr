<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Unlimited Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f2f6;
            margin: 0;
            padding: 0;
        }

        /* Hide number input arrows for a clean look */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .emoji-icon {
            font-size: 5rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .btn-sell {
            background-color: #f1f2f6;
            color: #333;
            transition: all 0.15s ease;
        }
        
        .btn-sell:active, .btn-sell.active {
            background-color: #e2e8f0;
        }

        .btn-buy {
            background-color: #2ecc71;
            color: white;
            transition: all 0.15s ease;
        }

        .btn-buy:active {
            background-color: #27ae60;
        }
    </style>
</head>
<body class="text-gray-900 pb-20">

    <!-- Top Navbar / Game Logo -->
    <nav class="bg-white py-5 px-6 text-2xl font-black tracking-widest text-black flex justify-center shadow-sm">
        UNLIMITED.SPEND
    </nav>

    <!-- Header Profile Section -->
    <div class="bg-white py-12 flex flex-col items-center justify-center mb-8">
        <div class="w-28 h-28 bg-gray-100 rounded-full flex items-center justify-center text-6xl mb-4 overflow-hidden border border-gray-200">
            🤑
        </div>
        <h1 class="text-3xl font-bold text-gray-800">Spend Unlimited Money</h1>
    </div>

    <!-- Sticky Total Bar -->
    <div class="bg-[#2ecc71] text-white text-center py-5 text-4xl sm:text-5xl font-bold sticky top-0 z-50 shadow-md transition-all" id="total-spent">
        $0
    </div>

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Items Grid -->
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Items injected by JavaScript -->
        </div>

        <!-- Receipt Section -->
        <div id="receipt-container" class="mt-12 bg-white max-w-2xl mx-auto py-10 px-6 sm:px-12 hidden shadow-sm">
            <h2 class="text-2xl font-bold text-center mb-8 text-gray-800">Your Receipt</h2>
            
            <div id="receipt-items" class="flex flex-col gap-1 mb-4 text-[17px] font-medium text-gray-800">
                <!-- Receipt rows injected here -->
            </div>
            
            <div class="flex justify-between border-t border-black pt-3 font-bold text-lg mt-4">
                <span>TOTAL</span>
                <span id="receipt-total" class="text-[#2ecc71]">$0</span>
            </div>

            <!-- Share Button -->
            <div class="flex justify-center mt-12">
                <button onclick="shareOnX()" class="bg-black hover:bg-gray-800 text-white font-bold py-3 px-6 rounded-md flex items-center gap-2 transition-colors shadow-sm">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    Share on 𝕏
                </button>
            </div>
        </div>
    </div>

    <script>
        // Array of realistic real-world items
        const items = [
            { id: 1, name: "Apple", price: 1, icon: "🍎" },
            { id: 2, name: "Big Mac", price: 2, icon: "🍔" },
            { id: 3, name: "Flip Flops", price: 3, icon: "🩴" },
            { id: 4, name: "Coca-Cola Pack", price: 5, icon: "🥤" },
            { id: 5, name: "Movie Ticket", price: 12, icon: "🎫" },
            { id: 6, name: "Book", price: 15, icon: "📚" },
            { id: 7, name: "Lobster Dinner", price: 45, icon: "🦞" },
            { id: 8, name: "Video Game", price: 60, icon: "🎮" },
            { id: 9, name: "Amazon Echo", price: 99, icon: "🔊" },
            { id: 10, name: "Year of Netflix", price: 120, icon: "🍿" },
            { id: 11, name: "Air Jordans", price: 200, icon: "👟" },
            { id: 12, name: "Drone", price: 350, icon: "🚁" },
            { id: 13, name: "Smartphone", price: 699, icon: "📱" },
            { id: 14, name: "Bike", price: 800, icon: "🚲" },
            { id: 15, name: "Kitten", price: 1500, icon: "🐈" },
            { id: 16, name: "Puppy", price: 1500, icon: "🐕" },
            { id: 17, name: "Auto Rickshaw", price: 2300, icon: "🛺" },
            { id: 18, name: "Horse", price: 2500, icon: "🐎" },
            { id: 19, name: "Acre of Farmland", price: 3000, icon: "🌾" },
            { id: 20, name: "Designer Handbag", price: 5500, icon: "👜" },
            { id: 21, name: "Hot Tub", price: 6000, icon: "🛁" },
            { id: 22, name: "Diamond Ring", price: 10000, icon: "💍" },
            { id: 23, name: "Jet Ski", price: 12000, icon: "🚤" },
            { id: 24, name: "Rolex", price: 15000, icon: "⌚" },
            { id: 25, name: "Ford F-150", price: 30000, icon: "🛻" },
            { id: 26, name: "Tesla", price: 75000, icon: "🚘" },
            { id: 27, name: "Monster Truck", price: 150000, icon: "🛞" },
            { id: 28, name: "Ferrari", price: 250000, icon: "🏎️" },
            { id: 29, name: "Single Family Home", price: 300000, icon: "🏠" },
            { id: 30, name: "Gold Bar", price: 700000, icon: "🪙" },
            { id: 31, name: "McDonalds Franchise", price: 1500000, icon: "🍟" },
            { id: 32, name: "Superbowl Ad", price: 5250000, icon: "🏈" },
            { id: 33, name: "Yacht", price: 7500000, icon: "🛥️" },
            { id: 34, name: "M1 Abrams", price: 8000000, icon: "🪖" },
            { id: 35, name: "Formula 1 Car", price: 15000000, icon: "🏁" },
            { id: 36, name: "Apache Helicopter", price: 31000000, icon: "🚁" },
            { id: 37, name: "Mansion", price: 45000000, icon: "🏛️" },
            { id: 38, name: "Make a Movie", price: 100000000, icon: "🎬" },
            { id: 39, name: "Boeing 747", price: 148000000, icon: "✈️" },
            { id: 40, name: "Mona Lisa", price: 780000000, icon: "🖼️" },
            { id: 41, name: "Skyscraper", price: 850000000, icon: "🏙️" },
            { id: 42, name: "Cruise Ship", price: 930000000, icon: "🛳️" },
            { id: 43, name: "NBA Team", price: 2120000000, icon: "🏀" }
        ];

        let quantities = {};
        let totalSpent = 0;

        // Formats large numbers to shorthand (e.g. $100k, $1.3m) matching the receipt screenshot
        function formatAbbreviated(num) {
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'b';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'm';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(num % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'k';
            return '$' + num;
        }

        // Formats standard currency
        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            
            items.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = "bg-white p-5 flex flex-col items-center justify-between shadow-sm";
                
                card.innerHTML = `
                    <div class="emoji-icon">${item.icon}</div>
                    <h3 class="font-bold text-xl text-gray-800 mt-2 text-center leading-tight">${item.name}</h3>
                    <p class="text-[#2ecc71] font-bold text-xl mb-5">${formatMoney(item.price)}</p>
                    
                    <div class="grid grid-cols-[1fr_1.5fr_1fr] gap-2 w-full mt-auto">
                        <button onclick="updateQty(${item.id}, -1)" class="btn-sell font-bold py-2 px-1 rounded text-sm sm:text-base select-none">
                            Sell
                        </button>
                        
                        <input type="number" id="input-${item.id}" value="0" min="0" 
                            class="border border-gray-300 rounded text-center w-full font-bold text-gray-800 py-2 outline-none focus:border-[#2ecc71] transition-colors"
                            onchange="manualUpdate(${item.id}, this.value)">
                        
                        <button onclick="updateQty(${item.id}, 1)" class="btn-buy font-bold py-2 px-1 rounded text-sm sm:text-base select-none">
                            Buy
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            
            quantities[id] = current;
            document.getElementById(`input-${id}`).value = current;
            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            items.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            
            document.getElementById('total-spent').innerText = formatMoney(totalSpent);
            updateReceipt();
        }

        function updateReceipt() {
            const container = document.getElementById('receipt-container');
            const receiptDiv = document.getElementById('receipt-items');
            
            if (totalSpent === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            receiptDiv.innerHTML = '';
            
            items.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const itemTotal = item.price * qty;
                    // Perfectly matching the 3-column spacing from the screenshot
                    receiptDiv.innerHTML += `
                        <div class="flex justify-between items-center py-1">
                            <div class="w-[50%] text-left pr-2 truncate">${item.name}</div>
                            <div class="w-[20%] text-left">x${qty}</div>
                            <div class="w-[30%] text-right font-bold text-[#2ecc71]">${formatAbbreviated(itemTotal)}</div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('receipt-total').innerText = formatMoney(totalSpent);
        }

        function shareOnX() {
            const text = `I just went on a shopping spree and spent ${formatMoney(totalSpent)} on UNLIMITED.SPEND! 💸 Try to beat my score.`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Initialize App
        renderGrid();
    </script>
</body>
</html>

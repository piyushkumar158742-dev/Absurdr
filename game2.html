<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>Stop at 5.000 — Cosmic Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ============ Game 3 Specific Styles ============ */
  .game-3-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  /* Logo-style Title */
  .stop-title {
    position: absolute;
    top: 10vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 8px;
    font-size: clamp(0.8rem, 2vw, 1.2rem);
    color: var(--text-muted);
    user-select: none;
  }
  
  .stop-title .logo-highlight {
    font-family: 'Space Mono', monospace;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700;
    letter-spacing: -2px;
    margin-top: 4px;
    background: linear-gradient(135deg, #ffffff 0%, var(--nebula-violet) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(124,108,240,0.4));
  }

  /* Digital Rectangular Timer */
  .timer-display {
    display: flex;
    gap: 8px;
    margin-top: 4vh;
    margin-bottom: 3.5rem;
  }

  .digit-box {
    width: clamp(45px, 10vw, 75px);
    height: clamp(65px, 14vw, 100px);
    background: rgba(52, 217, 122, 0.05);
    border: 2px solid rgba(52, 217, 122, 0.4);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #34d97a; /* Green numbers */
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 15px rgba(52, 217, 122, 0.1);
    transition: color 0.1s ease, border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    text-shadow: 0 0 15px rgba(52, 217, 122, 0.5);
  }

  .digit-box.dot {
    width: clamp(20px, 4vw, 30px);
    background: transparent;
    border: none;
    box-shadow: none;
    color: rgba(255, 255, 255, 0.3);
    align-items: flex-end;
    padding-bottom: 15px;
    text-shadow: none;
  }

  /* Invisible Time Mechanic */
  .timer-display.hidden-time .digit-box:not(.dot) {
    color: transparent;
    text-shadow: none;
  }

  /* End States */
  .timer-display.failed .digit-box:not(.dot) {
    color: #ff6767;
    border-color: rgba(255, 103, 103, 0.4);
    background: rgba(255, 103, 103, 0.05);
    box-shadow: inset 0 0 15px rgba(255, 103, 103, 0.1);
    text-shadow: 0 0 15px rgba(255, 103, 103, 0.5);
  }

  .timer-display.close .digit-box:not(.dot) {
    color: var(--stellar-gold);
    border-color: rgba(240, 194, 110, 0.5);
    background: rgba(240, 194, 110, 0.08);
    box-shadow: inset 0 0 20px rgba(240, 194, 110, 0.15);
    text-shadow: 0 0 20px rgba(240, 194, 110, 0.6);
  }

  .action-btn {
    background: rgba(124, 108, 240, 0.15);
    border: 2px solid var(--nebula-violet);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    padding: 1rem 3.5rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 0 20px rgba(124, 108, 240, 0.2);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .action-btn:hover {
    background: rgba(124, 108, 240, 0.4);
    box-shadow: 0 0 35px rgba(124, 108, 240, 0.5);
    transform: translateY(-2px);
  }

  .action-btn:active {
    transform: translateY(2px) scale(0.96);
  }

  .result-message {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: var(--text-muted);
    margin-top: 2.5rem;
    height: 1.5em; /* Reserve space so UI doesn't jump */
    text-align: center;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .result-message.visible {
    opacity: 1;
    transform: translateY(0);
  }
  
  .result-message strong {
    color: var(--text-primary);
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body data-game-index="2">

  <!-- Shared Backgrounds -->
  <div class="bg-void"></div>
  <div class="bg-grid"></div>
  <div class="bg-orbit-wrap"><svg id="orbit-svg" viewBox="0 0 700 700"></svg></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Settings -->
  <button id="settings-btn" class="settings-btn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" type="button">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="19" r="1.6" fill="currentColor"></circle>
    </svg>
  </button>

  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Sound</span>
      <button class="settings-toggle" id="sound-toggle" role="switch" aria-checked="true" type="button"></button>
    </div>
  </div>

  <!-- Game Interface -->
  <div class="app-container">
    <div class="game-3-container">
      <div class="stop-title">
        Target Protocol
        <div class="logo-highlight">STOP AT 5.000</div>
      </div>
      
      <div class="timer-display" id="timer-display">
        <!-- Rendered by JS -->
      </div>
      
      <button class="action-btn" id="action-btn">Start</button>
      
      <div class="result-message" id="result-message"></div>
    </div>
  </div>

  <!-- Shared Navigation -->
  <nav class="game-nav" id="game-nav" aria-label="Game navigation" tabindex="0">
    <button class="game-nav-btn" id="back-game-btn" aria-label="Previous game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 5 7.5 12l9 7Z"></path>
      </svg>
    </button>
    <button class="game-nav-btn random-btn" id="random-game-btn" aria-label="Random game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
    <button class="game-nav-btn" id="next-game-btn" aria-label="Next game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 5l9 7-9 7Z"></path>
      </svg>
    </button>
  </nav>

<!-- Ecosystem Shared Scripts -->
<script src="shared.js"></script>

<!-- Game 3 Logic -->
<script>
(function(){
  const timerDisplay = document.getElementById('timer-display');
  const actionBtn = document.getElementById('action-btn');
  const resultMessage = document.getElementById('result-message');
  
  let isRunning = false;
  let startTime = 0;
  let animationFrameId = null;

  function formatTime(timeInSeconds) {
    return timeInSeconds.toFixed(3);
  }

  // Parses the string and creates distinct boxes for each character
  function renderTimer(timeStr) {
    const chars = timeStr.split('');
    timerDisplay.innerHTML = chars.map(c => {
      if(c === '.') return `<div class="digit-box dot">.</div>`;
      return `<div class="digit-box">${c}</div>`;
    }).join('');
  }

  // Initial render
  renderTimer("0.000");

  function startTimer() {
    isRunning = true;
    actionBtn.textContent = 'Stop';
    
    // Reset visuals
    timerDisplay.classList.remove('failed', 'close', 'hidden-time');
    resultMessage.classList.remove('visible');
    
    startTime = performance.now();
    
    function tick() {
      if (!isRunning) return;
      
      let elapsed = (performance.now() - startTime) / 1000;
      
      // Auto-fail if taking too long
      if (elapsed >= 10.000) {
        elapsed = 10.000;
        renderTimer(formatTime(elapsed));
        stopTimer(true); 
        return;
      }
      
      // Invisible time mechanic
      if (elapsed >= 2.000) {
        timerDisplay.classList.add('hidden-time');
      }
      
      renderTimer(formatTime(elapsed));
      animationFrameId = requestAnimationFrame(tick);
    }
    
    animationFrameId = requestAnimationFrame(tick);
  }

  function stopTimer(forceFail = false) {
    isRunning = false;
    cancelAnimationFrame(animationFrameId);
    actionBtn.textContent = 'Start';
    timerDisplay.classList.remove('hidden-time'); // Reveal the time immediately
    
    let finalTime = (performance.now() - startTime) / 1000;
    
    // Check for 10-second timeout
    if (forceFail || finalTime >= 10.000) {
      renderTimer("10.000");
      timerDisplay.classList.add('failed');
      resultMessage.innerHTML = "You are too slow!";
      resultMessage.classList.add('visible');
      return;
    }

    // ==========================================
    // THE TROLL MECHANIC
    // ==========================================
    let formattedStr = formatTime(finalTime);
    if (formattedStr === "5.000") {
      // Pick a random offset between 1 and 4 milliseconds (positive or negative)
      const offsets = [0.001, 0.002, 0.003, 0.004, -0.001, -0.002, -0.003, -0.004];
      const randomOffset = offsets[Math.floor(Math.random() * offsets.length)];
      finalTime = 5.000 + randomOffset;
    }
    // ==========================================

    // Update screen to the "final" (potentially trolled) time
    renderTimer(formatTime(finalTime));
    
    // Calculate difference
    let diff = Math.abs(5.000 - finalTime);
    
    // Present the result
    resultMessage.innerHTML = `You were <strong>${formatTime(diff)}</strong> seconds away.`;
    resultMessage.classList.add('visible');
    
    // Color coding based on how close they were
    if (diff <= 0.050) {
      timerDisplay.classList.add('close'); // Gold styling
    } else if (diff >= 1.000) {
      timerDisplay.classList.add('failed'); // Red styling if they were really far off
    }
  }

  function handleAction() {
    if (isRunning) {
      stopTimer();
    } else {
      startTimer();
    }
  }

  // Button Click event
  actionBtn.addEventListener('click', () => {
    handleAction();
    actionBtn.blur(); // Remove focus so pressing spacebar later doesn't click it twice
  });

  // Spacebar event (globally)
  document.addEventListener('keydown', (e) => {
    // Only trigger if Spacebar is pressed, and not holding modifier keys
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault(); // Stop page scrolling
      handleAction();
    }
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030303;
            --card-bg: rgba(18, 18, 18, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Sleek Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Hide Number Input Arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* Premium Item Card */
        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .item-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            background: rgba(24, 24, 24, 0.85);
        }

        /* Rarity Inventory Slot System */
        .icon-slot {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            background: #0a0a0a;
            border: 1px solid #222;
            position: relative;
            user-select: none;
            transition: all 0.3s ease;
        }
        @media (min-width: 640px) {
            .icon-slot { width: 80px; height: 80px; font-size: 3.2rem; }
        }
        
        /* Subtle Rarity Glows */
        .rarity-common .icon-slot { box-shadow: inset 0 0 15px rgba(255,255,255,0.03); border-color: #2a2a2a; }
        .rarity-uncommon .icon-slot { box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.25); }
        .rarity-rare .icon-slot { box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.35); }
        .rarity-epic .icon-slot { box-shadow: inset 0 0 25px rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.45); }
        .rarity-legendary .icon-slot { box-shadow: inset 0 0 30px rgba(245, 158, 11, 0.25); border-color: rgba(245, 158, 11, 0.5); }

        .icon-slot span {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
            transform: scale(1);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .item-card:hover .icon-slot span { transform: scale(1.15) rotate(3deg); }

        /* Button Controls */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #a3a3a3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.15s;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .ctrl-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.25); }

        .price-font { font-family: 'Space Grotesk', sans-serif; }
        
        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="pt-28 pb-16 antialiased">

    <!-- Premium Header -->
    <header class="fixed top-0 left-0 right-0 h-[80px] bg-[#030303]/80 backdrop-blur-xl border-b border-white/10 z-50 flex items-center justify-between px-4 sm:px-8 shadow-2xl">
        
        <!-- Brand Name -->
        <div class="flex items-center gap-3 w-1/4">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse hidden sm:block shadow-[0_0_10px_#10b981]"></div>
            <span class="font-black tracking-widest text-white text-sm sm:text-xl uppercase drop-shadow-md hidden sm:block">Block Market</span>
        </div>
        
        <!-- Live Total -->
        <div class="flex-1 flex justify-center items-center">
            <span class="price-font font-bold text-3xl sm:text-4xl tracking-tight gradient-text drop-shadow-[0_2px_15px_rgba(16,185,129,0.2)]" id="total-spent">$0</span>
        </div>

        <!-- Receipt Button -->
        <div class="w-1/4 flex justify-end">
            <button onclick="openReceipt()" class="bg-white text-black hover:bg-gray-200 font-bold py-2.5 px-5 sm:px-7 rounded-full text-sm transition-all shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.25)] active:scale-95 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="hidden sm:inline">Receipt</span>
            </button>
        </div>
    </header>

    <!-- Main Grid (Responsive: 2 mobile, 3 large mobile, 4 tablet, 5 desktop) -->
    <div class="max-w-[1400px] mx-auto px-3 sm:px-6">
        <div id="items-grid" class="grid grid-cols-2 min-[500px]:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-5 items-stretch">
            <!-- Injected dynamically -->
        </div>
    </div>

    <!-- Receipt Modal Overlay -->
    <div id="receipt-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center opacity-0 transition-opacity duration-300 backdrop-blur-md p-4">
        
        <div id="receipt-content" class="bg-[#0a0a0a] border border-[#222] rounded-3xl w-full max-w-xl flex flex-col relative shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh]">
            
            <!-- Close Button -->
            <button onclick="closeReceipt()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors bg-[#111] hover:bg-[#222] p-2 rounded-full z-10 border border-[#222]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Receipt Header -->
            <div class="p-6 sm:p-8 border-b border-[#1f1f1f] text-center">
                <h2 class="text-2xl sm:text-3xl font-black text-white tracking-widest uppercase">Block Market</h2>
                <p class="text-gray-500 text-xs sm:text-sm mt-2 font-mono uppercase tracking-widest">Official Transaction Receipt</p>
            </div>
            
            <!-- Receipt Items List -->
            <div id="receipt-list" class="p-6 sm:p-8 overflow-y-auto flex-1 space-y-3 font-medium text-gray-300 text-sm sm:text-base">
                <!-- Rows injected here -->
            </div>
            
            <!-- Receipt Footer & Share -->
            <div class="p-6 sm:p-8 border-t border-[#1f1f1f] bg-[#050505] rounded-b-3xl">
                <div class="flex justify-between items-center mb-6 sm:mb-8">
                    <span class="text-base sm:text-lg text-gray-400 uppercase tracking-widest">Total Due</span>
                    <span class="text-3xl sm:text-4xl font-black text-white price-font" id="receipt-total">$0</span>
                </div>
                
                <button onclick="shareOnX()" class="w-full bg-white hover:bg-gray-200 text-black font-bold py-3.5 sm:py-4 rounded-xl flex items-center justify-center gap-3 transition-transform active:scale-[0.98]">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    Share on 𝕏
                </button>
            </div>
        </div>
    </div>

    <script>
        const inventory = [];
        let idCounter = 1;

        // Realistic USD Pricing & Rarity Glow Mapping
        function getRarityClass(price) {
            if (price >= 1000000) return 'rarity-legendary';
            if (price >= 25000) return 'rarity-epic';
            if (price >= 1000) return 'rarity-rare';
            if (price >= 50) return 'rarity-uncommon';
            return 'rarity-common';
        }

        function addEntity(name, price, icon) {
            inventory.push({ id: idCounter++, name, price, icon, rarity: getRarityClass(price) });
        }

        // ==========================================
        // GENERATE DATA (~200 ITEMS)
        // ==========================================
        const blockBasics = [
            {n: 'Dirt Block', p: 1, i: '🟫'}, {n: 'Grass Block', p: 3, i: '🟩'},
            {n: 'Cobblestone', p: 2, i: '🌑'}, {n: 'Stone Block', p: 5, i: '🪨'},
            {n: 'Sand Block', p: 2, i: '🏖️'}, {n: 'Gravel Block', p: 2, i: '🪨'},
            {n: 'Clay Block', p: 8, i: '🧱'}, {n: 'Bricks', p: 25, i: '🧱'},
            {n: 'Obsidian', p: 5000, i: '⬛'}, {n: 'Bedrock', p: 1000000000, i: '🕳️'},
            {n: 'Coal Block', p: 135, i: '⬛'}, {n: 'Iron Block', p: 1350, i: '⬜'},
            {n: 'Gold Block', p: 13500, i: '🟨'}, {n: 'Diamond Block', p: 90000, i: '💠'},
            {n: 'Emerald Block', p: 45000, i: '🟩'}, {n: 'Netherite Block', p: 2250000, i: '🔲'},
            {n: 'Slime Block', p: 450, i: '🟩'}, {n: 'Honey Block', p: 500, i: '🍯'},
            {n: 'Magma Block', p: 250, i: '🌋'}, {n: 'Soul Sand', p: 150, i: '👻'},
            {n: 'Glowstone', p: 750, i: '💡'}, {n: 'Sea Lantern', p: 1200, i: '🏮'},
            {n: 'Sponge', p: 800, i: '🧽'}, {n: 'Wet Sponge', p: 850, i: '🧽'},
            {n: 'End Stone', p: 200, i: '🌕'}, {n: 'Purpur Block', p: 350, i: '🟪'},
            {n: 'Basalt', p: 30, i: '🪨'}, {n: 'Blackstone', p: 40, i: '⬛'},
            {n: 'Prismarine', p: 600, i: '🌊'}, {n: 'Netherrack', p: 5, i: '🟥'}
        ];
        blockBasics.forEach(b => addEntity(b.n, b.p, b.i));

        const woods = ['Oak', 'Spruce', 'Birch', 'Jungle', 'Acacia', 'Dark Oak'];
        woods.forEach(w => {
            addEntity(`${w} Log`, 10, '🪵');
            addEntity(`${w} Planks`, 3, '🟫');
            addEntity(`${w} Leaves`, 2, '🌿');
        });

        const colors = ['White', 'Light Gray', 'Gray', 'Black', 'Brown', 'Red', 'Orange', 'Yellow', 'Lime', 'Green', 'Cyan', 'Light Blue', 'Blue', 'Purple', 'Magenta', 'Pink'];
        colors.forEach(c => {
            addEntity(`${c} Wool`, 15, '🐑');
            addEntity(`${c} Concrete`, 25, '🧱');
            addEntity(`${c} Glass`, 20, '🧊');
            addEntity(`${c} Terracotta`, 35, '🏺');
        });

        const tiers = [
            { t: 'Wooden', p: 20 }, { t: 'Stone', p: 50 },
            { t: 'Iron', p: 450 }, { t: 'Golden', p: 4500 },
            { t: 'Diamond', p: 30000 }, { t: 'Netherite', p: 850000 }
        ];
        const gear = ['Sword', 'Pickaxe', 'Axe', 'Shovel', 'Hoe', 'Helmet', 'Chestplate', 'Leggings', 'Boots'];
        tiers.forEach(tier => {
            gear.forEach(g => {
                let icon = '🗡️';
                if(g==='Pickaxe') icon = '⛏️'; if(g==='Axe') icon = '🪓';
                if(g==='Shovel') icon = '🥄'; if(g==='Hoe') icon = '🦯';
                if(g==='Helmet') icon = '🪖'; if(g==='Chestplate') icon = '👕';
                if(g==='Leggings') icon = '👖'; if(g==='Boots') icon = '🥾';
                let multiplier = (g==='Chestplate'?8:g==='Leggings'?7:g==='Helmet'||g==='Boots'?4:3);
                addEntity(`${tier.t} ${g}`, tier.p * multiplier, icon);
            });
        });

        const foods = [
            {n: 'Apple', p: 2, i: '🍎'}, {n: 'Bread', p: 4, i: '🍞'},
            {n: 'Cooked Porkchop', p: 12, i: '🍖'}, {n: 'Cooked Beef', p: 15, i: '🥩'},
            {n: 'Golden Apple', p: 25000, i: '🍏'}, {n: 'Enchanted Golden Apple', p: 5000000, i: '🍎'},
            {n: 'Carrot', p: 1, i: '🥕'}, {n: 'Potato', p: 1, i: '🥔'},
            {n: 'Baked Potato', p: 3, i: '🥔'}, {n: 'Cookie', p: 2, i: '🍪'},
            {n: 'Whole Cake', p: 25, i: '🎂'}, {n: 'Pumpkin Pie', p: 18, i: '🥧'},
            {n: 'Mushroom Stew', p: 10, i: '🥣'}, {n: 'Suspicious Stew', p: 500, i: '🍲'},
            {n: 'Sweet Berries', p: 2, i: '🍓'}, {n: 'Glow Berries', p: 150, i: '🟡'},
            {n: 'Melon Slice', p: 3, i: '🍉'}, {n: 'Chorus Fruit', p: 800, i: '🍇'},
            {n: 'Spider Eye', p: 100, i: '👁️'}, {n: 'Rotten Flesh', p: 1, i: '🧟'}
        ];
        foods.forEach(f => addEntity(f.n, f.p, f.i));

        const materials = [
            {n: 'Piece of Coal', p: 15, i: '🪨'}, {n: 'Raw Iron', p: 100, i: '🪙'},
            {n: 'Iron Ingot', p: 150, i: '🔩'}, {n: 'Raw Gold', p: 1000, i: '🟡'},
            {n: 'Gold Ingot', p: 1500, i: '🥇'}, {n: 'Rough Diamond', p: 10000, i: '💎'},
            {n: 'Flawless Emerald', p: 5000, i: '🟢'}, {n: 'Netherite Scrap', p: 50000, i: '⚙️'},
            {n: 'Netherite Ingot', p: 250000, i: '⬛'}, {n: 'Lapis Lazuli', p: 50, i: '🔷'},
            {n: 'Redstone Dust', p: 120, i: '🔴'}, {n: 'Copper Ingot', p: 80, i: '🥉'},
            {n: 'Amethyst Shard', p: 1500, i: '💜'}, {n: 'Nether Quartz', p: 300, i: '🤍'},
            {n: 'Wooden Stick', p: 1, i: '🦯'}, {n: 'Spider String', p: 10, i: '🧵'},
            {n: 'Chicken Feather', p: 2, i: '🪶'}, {n: 'Gunpowder', p: 200, i: '🧨'},
            {n: 'Cow Leather', p: 25, i: '👞'}, {n: 'Sharp Flint', p: 5, i: '🪨'},
            {n: 'Ender Pearl', p: 15000, i: '🔮'}, {n: 'Eye of Ender', p: 35000, i: '👁️‍🗨️'},
            {n: 'Totem of Undying', p: 10000000, i: '🏺'}, {n: 'Elytra Wings', p: 50000000, i: '🦋'},
            {n: 'Leather Saddle', p: 350, i: '💺'}, {n: 'Nametag', p: 5000, i: '🏷️'},
            {n: 'Wooden Bow', p: 150, i: '🏹'}, {n: 'Flint Arrow', p: 5, i: '↗️'},
            {n: 'Enchanted Trident', p: 2500000, i: '🔱'}, {n: 'Wooden Shield', p: 250, i: '🛡️'},
            {n: 'Beacon', p: 25000000, i: '🗼'}, {n: 'Dragon Egg', p: 5000000000, i: '🥚'}
        ];
        materials.forEach(m => addEntity(m.n, m.p, m.i));

        // ==========================================
        // UI & LOGIC
        // ==========================================
        const quantities = {};
        let totalSpent = 0;

        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        }

        function formatShorthand(num) {
            if (num >= 1e12) return '$' + (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(num % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'K';
            return '$' + num;
        }

        function initGrid() {
            const grid = document.getElementById('items-grid');
            inventory.forEach(item => {
                quantities[item.id] = 0;
                const card = document.createElement('div');
                card.className = `item-card rounded-[20px] p-4 sm:p-5 ${item.rarity}`;
                
                // Note: The input container uses min-w-0 and w-full to prevent flex blowouts, 
                // and font sizes adjust so 9,999,999 fits perfectly even on mobile screens.
                card.innerHTML = `
                    <div class="icon-slot"><span>${item.icon}</span></div>
                    <div class="flex-grow flex flex-col items-center justify-start w-full">
                        <h3 class="text-sm sm:text-base font-semibold text-center text-gray-200 leading-snug mb-2 w-full">${item.name}</h3>
                    </div>
                    <div class="mt-auto w-full pt-1">
                        <p class="text-white price-font text-center font-bold text-base sm:text-lg mb-3 tracking-wide opacity-90">${formatShorthand(item.price)}</p>
                        
                        <div class="flex items-center justify-between w-full gap-1 sm:gap-2 bg-black/60 p-1 rounded-xl border border-white/10">
                            <button onclick="updateQty(${item.id}, -1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg transition-transform select-none">-</button>
                            
                            <input type="number" id="input-${item.id}" value="0" min="0" 
                                class="bg-transparent text-center font-bold text-white w-full min-w-0 outline-none price-font text-sm sm:text-base px-0.5"
                                oninput="if(this.value.length > 7) this.value = this.value.slice(0, 7); manualUpdate(${item.id}, this.value)">
                            
                            <button onclick="updateQty(${item.id}, 1)" class="ctrl-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-bold shrink-0 text-lg transition-transform select-none">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, change) {
            let current = quantities[id] || 0;
            current += change;
            if (current < 0) current = 0;
            if (current > 9999999) current = 9999999;
            quantities[id] = current;
            
            const inputEl = document.getElementById(`input-${id}`);
            inputEl.value = current;
            
            // Subtle pop animation on change
            inputEl.style.transform = 'scale(1.1)';
            setTimeout(() => inputEl.style.transform = 'scale(1)', 150);

            calculateTotal();
        }

        function manualUpdate(id, value) {
            let num = parseInt(value);
            if (isNaN(num) || num < 0) num = 0;
            if (num > 9999999) num = 9999999;
            quantities[id] = num;
            document.getElementById(`input-${id}`).value = num;
            calculateTotal();
        }

        function calculateTotal() {
            totalSpent = 0;
            inventory.forEach(item => {
                totalSpent += (item.price * (quantities[item.id] || 0));
            });
            document.getElementById('total-spent').innerText = formatShorthand(totalSpent);
            
            if (!document.getElementById('receipt-modal').classList.contains('hidden')) {
                buildReceipt();
            }
        }

        // ==========================================
        // MODAL & RECEIPT
        // ==========================================
        const modal = document.getElementById('receipt-modal');
        const modalContent = document.getElementById('receipt-content');

        function openReceipt() {
            if (totalSpent === 0) {
                alert("Your inventory cart is empty.");
                return;
            }
            buildReceipt();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeReceipt() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function buildReceipt() {
            const list = document.getElementById('receipt-list');
            list.innerHTML = '';
            
            inventory.forEach(item => {
                const qty = quantities[item.id];
                if (qty > 0) {
                    const lineTotal = item.price * qty;
                    list.innerHTML += `
                        <div class="flex items-center justify-between py-3 border-b border-[#222] last:border-0">
                            <div class="flex items-center gap-3 sm:gap-4 w-1/2">
                                <span class="text-xl sm:text-2xl filter grayscale brightness-150">${item.icon}</span>
                                <span class="text-gray-200 leading-tight truncate">${item.name}</span>
                            </div>
                            <div class="w-1/6 text-right text-gray-500 font-bold">x${qty}</div>
                            <div class="w-1/3 text-right price-font text-white font-bold tracking-wide">${formatShorthand(lineTotal)}</div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('receipt-total').innerText = formatMoney(totalSpent);
        }

        function shareOnX() {
            const text = `I just dropped ${formatMoney(totalSpent)} on the Block Market! 💸 Try to beat my high score.`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Run
        initGrid();
    </script>
</body>
</html>

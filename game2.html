<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible Button Press</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        #mainBtn {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 40px 80px;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.4);
            position: absolute;
            transition: transform 0.1s, background-color 0.2s;
            z-index: 100;
        }

        #mainBtn:active {
            transform: scale(0.95);
        }

        .fake-btn {
            background-color: #cc0000;
            color: #ffffff;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            position: absolute;
            opacity: 0.8;
            pointer-events: none;
            z-index: 10;
        }

        .insult-text {
            position: absolute;
            font-size: 4rem;
            font-weight: bold;
            color: black;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            text-align: center;
            transition: opacity 0.5s;
        }

        /* Trap Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes flash {
            0% { background-color: white; }
            25% { background-color: red; }
            50% { background-color: yellow; }
            75% { background-color: blue; }
            100% { background-color: white; }
        }

        #fake-popup {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid black;
            padding: 30px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button id="mainBtn">The Impossible Button Press</button>
    
    <div id="insult1" class="insult-text" style="top: 20%; left: 10%;">MY GRANDMA IS FASTER!</div>
    <div id="insult2" class="insult-text" style="bottom: 20%; right: 10%;">JUST GIVE UP ALREADY.</div>

    <div id="fake-popup">
        <h2>FATAL ERROR 404</h2>
        <p>Your cursor is too slow.</p>
        <button onclick="document.getElementById('fake-popup').style.display='none'">OK</button>
    </div>

    <script>
        const btn = document.getElementById('mainBtn');
        const body = document.body;
        
        let state = 0; 
        // 0 = Initial
        // 1 = Dodging
        // 2 = Shrinking
        // 3 = Trap sequence

        let dodgeTarget = Math.floor(Math.random() * 11) + 10; // Random 10 to 20 dodges
        let dodges = 0;
        let teleports = 0;
        let trapInterval;

        // Ensure button starts centered
        btn.style.left = `calc(50% - ${btn.offsetWidth / 2}px)`;
        btn.style.top = `calc(50% - ${btn.offsetHeight / 2}px)`;

        function moveButton() {
            const maxX = window.innerWidth - btn.offsetWidth;
            const maxY = window.innerHeight - btn.offsetHeight;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        }

        // Proximity detection for dodging and shrinking
        document.addEventListener('mousemove', (e) => {
            if (state === 0 || state === 3) return; // Do nothing on initial or trap phase

            const rect = btn.getBoundingClientRect();
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;
            const dist = Math.hypot(e.clientX - btnX, e.clientY - btnY);

            if (state === 1) {
                // Phase 1: Dodging
                if (dist < 200) { // If mouse gets within 200px
                    dodges++;
                    if (dodges >= dodgeTarget) {
                        state = 2; // Move to shrinking phase
                    } else {
                        moveButton();
                    }
                }
            } else if (state === 2) {
                // Phase 2: Shrinking based on proximity
                let scale = Math.max(0, dist / 400); // Scales down as you get closer
                if (scale > 1) scale = 1;
                
                // Keep the button centered on its coordinates while shrinking
                btn.style.transform = `scale(${scale})`;
            }
        });

        btn.addEventListener('click', () => {
            if (state === 0) {
                // First click
                state = 1;
                btn.innerText = "Press Me!";
                btn.style.padding = "20px 40px"; // Smaller but still big
                btn.style.fontSize = "2rem";
                moveButton();
            } else if (state === 2) {
                // Clicked during shrinking phase (the "teleport" resets)
                teleports++;
                if (teleports >= 5) {
                    state = 3;
                    initiateTraps();
                } else {
                    // Teleport and reset scale
                    btn.style.transform = 'scale(1)';
                    moveButton();
                    // Force mouse to have to back away to avoid instant re-shrinking bug
                    btn.style.pointerEvents = 'none';
                    setTimeout(() => { btn.style.pointerEvents = 'auto'; }, 500);
                }
            }
        });

        // The 15 Rage Traps Sequence
        function initiateTraps() {
            btn.innerText = "U MAD?";
            btn.style.transform = 'scale(1)';
            
            let trapStep = 1;
            
            const traps = setInterval(() => {
                switch(trapStep) {
                    case 1:
                        // Trap 1: Spawn fake buttons
                        for(let i=0; i<30; i++) {
                            let fake = document.createElement('button');
                            fake.innerText = "Press Me!";
                            fake.className = 'fake-btn';
                            fake.style.left = Math.random() * window.innerWidth + 'px';
                            fake.style.top = Math.random() * window.innerHeight + 'px';
                            body.appendChild(fake);
                        }
                        break;
                    case 2:
                        // Trap 2: Screen goes upside down
                        body.style.transform = 'rotate(180deg)';
                        break;
                    case 3:
                        // Trap 3: Fake popup
                        document.getElementById('fake-popup').style.display = 'block';
                        break;
                    case 4:
                        // Trap 4: Hide cursor
                        body.style.cursor = 'none';
                        btn.style.cursor = 'none';
                        break;
                    case 5:
                        // Trap 5: Screen shake
                        body.style.animation = 'shake 0.5s infinite';
                        break;
                    case 6:
                        // Trap 6: Insult 1 appears
                        document.getElementById('insult1').style.opacity = '1';
                        break;
                    case 7:
                        // Trap 7: Flashing colors
                        body.style.animation = 'shake 0.5s infinite, flash 0.5s infinite';
                        break;
                    case 8:
                        // Trap 8: Heavy blur
                        body.style.filter = 'blur(4px)';
                        break;
                    case 9:
                        // Trap 9: Button moves erratically on its own
                        trapInterval = setInterval(moveButton, 300);
                        break;
                    case 10:
                        // Trap 10: Invert colors
                        body.style.filter = 'blur(4px) invert(100%)';
                        break;
                    case 11:
                        // Trap 11: Insult 2 appears
                        document.getElementById('insult2').style.opacity = '1';
                        break;
                    case 12:
                        // Trap 12: Shrink the whole game window
                        body.style.transform = 'rotate(180deg) scale(0.5)';
                        break;
                    case 13:
                        // Trap 13: Button grows massive
                        btn.style.transform = 'scale(10)';
                        btn.style.opacity = '0.5';
                        break;
                    case 14:
                        // Trap 14: Change text to final troll
                        btn.innerText = "FORMATTING C: DRIVE...";
                        btn.style.fontSize = "0.5rem";
                        break;
                    case 15:
                        // Trap 15: Black screen of death
                        clearInterval(traps);
                        clearInterval(trapInterval);
                        body.style = "background-color: black; color: white; display: flex; justify-content: center; align-items: center; font-size: 2rem;";
                        body.innerHTML = "<h1>GAME OVER. YOU GOT TROLLED.</h1>";
                        break;
                }
                trapStep++;
            }, 2000); // Triggers a new trap every 2 seconds
        }
    </script>
</body>
</html>

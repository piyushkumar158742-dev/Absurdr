<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>Stop at 5.000 — Cosmic Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .timer-panel{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:48px 28px; text-align:center; position:relative; overflow:hidden;
    max-width:560px; margin:0 auto; width:100%;
  }
  .timer-panel::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(124,108,240,0.10), transparent 65%);
    pointer-events:none;
  }
  .timer-ring-wrap{
    position:relative; width:min(62vw, 300px); height:min(62vw, 300px);
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .timer-ring-wrap svg{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .timer-ring-track{ fill:none; stroke:rgba(255,255,255,0.07); stroke-width:5; }
  .timer-ring-arc{
    fill:none; stroke:var(--nebula-violet); stroke-width:5; stroke-linecap:round;
    transition:stroke-dashoffset .04s linear, stroke .3s ease;
    filter:drop-shadow(0 0 8px rgba(124,108,240,0.6));
  }
  .timer-panel.running .timer-ring-arc{ stroke:var(--nebula-rose); filter:drop-shadow(0 0 8px rgba(239,108,155,0.6)); }
  .timer-display{
    font-family:'Space Mono',monospace; font-weight:700;
    font-size:clamp(2.1rem, 9vw, 3.6rem); color:#fff; letter-spacing:1px;
    text-shadow:0 0 30px rgba(124,108,240,0.45);
  }
  .timer-target{
    font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:2px;
    color:var(--text-muted); text-transform:uppercase; margin-top:8px;
  }
  .timer-btn{
    font-family:'Space Mono',monospace; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    font-size:0.9rem; padding:15px 46px; border-radius:50px; border:none;
    background:var(--nebula-violet); color:#05060f; cursor:pointer; z-index:2;
    transition:background .25s ease, transform .15s ease, box-shadow .25s ease;
    box-shadow:0 0 24px rgba(124,108,240,0.4);
  }
  .timer-btn:hover{ transform:translateY(-2px); }
  .timer-btn:active{ transform:translateY(0) scale(0.97); }
  .timer-btn.stop{ background:var(--nebula-rose); box-shadow:0 0 24px rgba(239,108,155,0.4); }
  .timer-btn:focus-visible{ outline:2px solid var(--stellar-gold); outline-offset:3px; }
  .timer-result{
    min-height:1.4em; font-family:'Space Mono',monospace;
    font-size:clamp(0.82rem, 2.4vw, 1rem); max-width:34ch; z-index:2;
    opacity:0; transform:translateY(6px); transition:opacity .35s ease, transform .35s ease;
  }
  .timer-result.visible{ opacity:1; transform:translateY(0); }
  .timer-result.fail{ color:var(--nebula-rose); }
  .timer-result.miss{ color:var(--stellar-gold); }
  .timer-hint{
    font-size:0.68rem; letter-spacing:1px; color:var(--text-muted);
    text-transform:uppercase; font-family:'Space Mono',monospace; z-index:2;
  }
  .timer-hint strong{ color:var(--text-primary); }
</style>
</head>
<body data-game-index="3">

  <div class="bg-void"></div>
  <div class="bg-grid"></div>
  <div class="bg-orbit-wrap"><svg id="orbit-svg" viewBox="0 0 700 700"></svg></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <button id="settings-btn" class="settings-btn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" type="button">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="19" r="1.6" fill="currentColor"></circle>
    </svg>
  </button>

  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Sound</span>
      <button class="settings-toggle" id="sound-toggle" role="switch" aria-checked="true" type="button"></button>
    </div>
  </div>

  <header>
    <h1>Stop at 5.000</h1>
    <p class="eyebrow">Precision Timer Challenge</p>
  </header>

  <div class="app-container">
    <div class="glass-panel timer-panel" id="timer-panel">
      <div class="timer-ring-wrap">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="timer-ring-track" cx="60" cy="60" r="54"></circle>
          <circle class="timer-ring-arc" id="timer-ring-arc" cx="60" cy="60" r="54" stroke-dasharray="339.29" stroke-dashoffset="339.29"></circle>
        </svg>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <div class="timer-display" id="timer-display">0.000</div>
          <div class="timer-target">Target — 5.000s</div>
        </div>
      </div>
      <button class="timer-btn" id="timer-btn" type="button">Start</button>
      <div class="timer-result" id="timer-result" aria-live="polite"></div>
      <div class="timer-hint">Press <strong>Space</strong> or tap the button</div>
    </div>
  </div>

  <nav class="game-nav" id="game-nav" aria-label="Game navigation" tabindex="0">
    <button class="game-nav-btn" id="back-game-btn" aria-label="Previous game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 5 7.5 12l9 7Z"></path>
      </svg>
    </button>
    <button class="game-nav-btn random-btn" id="random-game-btn" aria-label="Random game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
    <button class="game-nav-btn" id="next-game-btn" aria-label="Next game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 5l9 7-9 7Z"></path>
      </svg>
    </button>
  </nav>

<script src="shared.js"></script>
<script>
(function(){
  var display = document.getElementById('timer-display');
  var btn = document.getElementById('timer-btn');
  var result = document.getElementById('timer-result');
  var panel = document.getElementById('timer-panel');
  var ringArc = document.getElementById('timer-ring-arc');
  var CIRC = 2 * Math.PI * 54;
  var TARGET = 5.000;
  var TIMEOUT = 10.000;
  var running = false;
  var startTime = 0;
  var rafId = null;

  function setRing(fraction){
    var offset = CIRC * (1 - Math.min(Math.max(fraction, 0), 1));
    ringArc.style.strokeDashoffset = offset;
  }

  function tick(){
    if(!running) return;
    var elapsed = (performance.now() - startTime) / 1000;
    if(elapsed >= TIMEOUT){
      finish(TIMEOUT, true);
      return;
    }
    display.textContent = elapsed.toFixed(3);
    setRing(elapsed / TIMEOUT);
    rafId = requestAnimationFrame(tick);
  }

  function start(){
    running = true;
    startTime = performance.now();
    display.textContent = '0.000';
    setRing(0);
    btn.textContent = 'Stop';
    btn.classList.add('stop');
    panel.classList.add('running');
    result.classList.remove('visible', 'fail', 'miss');
    result.textContent = '';
    rafId = requestAnimationFrame(tick);
  }

  function finish(elapsedRaw, timedOut){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    panel.classList.remove('running');
    btn.textContent = 'Try Again';
    btn.classList.remove('stop');

    if(timedOut){
      display.textContent = TIMEOUT.toFixed(3);
      setRing(1);
      result.textContent = "You're too slow.";
      result.classList.add('visible', 'fail');
      return;
    }

    var diffMs = Math.round((elapsedRaw - TARGET) * 1000);
    if(diffMs === 0){
      // Never let it land exactly on target — nudge just off it.
      var nudge = 1 + Math.floor(Math.random() * 4);
      diffMs = Math.random() < 0.5 ? -nudge : nudge;
      elapsedRaw = TARGET + diffMs / 1000;
    }

    var clamped = Math.min(Math.max(elapsedRaw, 0), TIMEOUT);
    display.textContent = clamped.toFixed(3);
    setRing(clamped / TIMEOUT);

    var diffSeconds = (Math.abs(diffMs) / 1000).toFixed(3);
    result.textContent = diffSeconds + 's ' + (diffMs > 0 ? 'late' : 'early') + ' — so close!';
    result.classList.add('visible', 'miss');
  }

  function toggle(){
    if(running){
      var elapsed = (performance.now() - startTime) / 1000;
      finish(elapsed, false);
    } else {
      start();
    }
  }

  btn.addEventListener('click', toggle);
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar'){
      if(e.repeat) return;
      e.preventDefault();
      toggle();
    }
  });
})();
</script>
</body>
</html>
<!--
  GAME 4 — Stop at 5.000 (precision timer)
  ==========================================
  This is slot 4 of 7 in the Cosmic Arcade ecosystem (see index.html
  for the shared-chrome explanation). Press Start (or Space) to begin
  a stopwatch counting up from 0.000; press Stop (or Space again)
  before the 10.000s timeout to see how close you landed to the
  5.000s target. Landing exactly on target is deliberately impossible:
  finish() nudges an exact hit by 1-4ms before displaying the result,
  so the game can never be "won" outright — it only reports how many
  milliseconds early or late you were.
-->

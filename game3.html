<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060f">
<title>Stop at 5.000 — Cosmic Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ============ Game 3 Specific Styles ============ */
  .game-3-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    z-index: 2;
    padding-bottom: 5vh;
  }

  /* Logo-style Title */
  .stop-title-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 6vh;
  }

  .stop-title-small {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.75rem, 2.5vw, 1rem);
    color: var(--text-muted);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    opacity: 0.8;
  }

  .stop-title-main {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    line-height: 1.1;
    letter-spacing: -1px;
    white-space: nowrap;
    text-shadow: 0 4px 20px rgba(124, 108, 240, 0.4);
  }
  
  .stop-title-main span {
    color: #34d97a; /* Neon Green */
    font-family: 'Space Mono', monospace;
    text-shadow: 0 0 25px rgba(52, 217, 122, 0.5);
  }

  /* Clean Digital Timer (No Squares) */
  .timer-display {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(4.5rem, 12vw, 8rem);
    color: #34d97a; /* Neon Green */
    line-height: 1;
    margin-bottom: 3.5rem;
    font-variant-numeric: tabular-nums; /* Keeps width stable so text doesn't jitter */
    text-shadow: 0 0 30px rgba(52, 217, 122, 0.4);
    transition: color 0.1s ease, text-shadow 0.3s ease;
  }

  .timer-display.active {
    text-shadow: 0 0 40px rgba(52, 217, 122, 0.6);
  }

  /* 2-Second Invisibility Mechanic */
  .timer-display.hidden-time {
    color: transparent;
    text-shadow: none;
  }

  /* End States (when the user stops) */
  .timer-display.failed {
    color: #ff5b5b;
    text-shadow: 0 0 40px rgba(255, 91, 91, 0.6);
  }

  .timer-display.close {
    color: var(--stellar-gold);
    text-shadow: 0 0 40px rgba(240, 194, 110, 0.6);
  }

  /* Action Button */
  .action-btn {
    background: rgba(52, 217, 122, 0.1);
    border: 2px solid rgba(52, 217, 122, 0.6);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    padding: 1.2rem 4.5rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 0 25px rgba(52, 217, 122, 0.15);
    text-transform: uppercase;
    letter-spacing: 4px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .action-btn:hover {
    background: rgba(52, 217, 122, 0.25);
    border-color: #34d97a;
    box-shadow: 0 0 40px rgba(52, 217, 122, 0.4);
    transform: translateY(-3px);
  }

  .action-btn:active {
    transform: translateY(2px) scale(0.96);
  }

  /* Stop State Button Styling */
  .action-btn.btn-stop {
    background: rgba(255, 91, 91, 0.1);
    border-color: rgba(255, 91, 91, 0.6);
    box-shadow: 0 0 25px rgba(255, 91, 91, 0.15);
  }
  
  .action-btn.btn-stop:hover {
    background: rgba(255, 91, 91, 0.25);
    border-color: #ff5b5b;
    box-shadow: 0 0 40px rgba(255, 91, 91, 0.4);
  }

  .result-message {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: var(--text-muted);
    margin-top: 2.5rem;
    height: 1.5em; /* Prevents layout jump when text appears */
    text-align: center;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .result-message.visible {
    opacity: 1;
    transform: translateY(0);
  }
  
  .result-message strong {
    color: #fff;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body data-game-index="2">

  <!-- Shared Backgrounds -->
  <div class="bg-void"></div>
  <div class="bg-grid"></div>
  <div class="bg-orbit-wrap"><svg id="orbit-svg" viewBox="0 0 700 700"></svg></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Settings -->
  <button id="settings-btn" class="settings-btn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" type="button">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
      <circle cx="12" cy="19" r="1.6" fill="currentColor"></circle>
    </svg>
  </button>

  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Sound</span>
      <button class="settings-toggle" id="sound-toggle" role="switch" aria-checked="true" type="button"></button>
    </div>
  </div>

  <!-- Game Interface -->
  <div class="app-container">
    <div class="game-3-container">
      
      <!-- Logo Title -->
      <div class="stop-title-wrapper">
        <span class="stop-title-small">Reflex Challenge</span>
        <div class="stop-title-main">STOP AT <span>5.000</span></div>
      </div>
      
      <!-- Clean Number Display -->
      <div class="timer-display" id="timer-display">0.000</div>
      
      <button class="action-btn" id="action-btn">Start</button>
      
      <div class="result-message" id="result-message"></div>
    </div>
  </div>

  <!-- Shared Navigation -->
  <nav class="game-nav" id="game-nav" aria-label="Game navigation" tabindex="0">
    <button class="game-nav-btn" id="back-game-btn" aria-label="Previous game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 5 7.5 12l9 7Z"></path>
      </svg>
    </button>
    <button class="game-nav-btn random-btn" id="random-game-btn" aria-label="Random game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
    <button class="game-nav-btn" id="next-game-btn" aria-label="Next game" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 5l9 7-9 7Z"></path>
      </svg>
    </button>
  </nav>

<script src="shared.js"></script>

<!-- Game 3 Logic -->
<script>
(function(){
  const timerDisplay = document.getElementById('timer-display');
  const actionBtn = document.getElementById('action-btn');
  const resultMessage = document.getElementById('result-message');
  
  let isRunning = false;
  let startTime = 0;
  let animationFrameId = null;

  function formatTime(timeInSeconds) {
    return timeInSeconds.toFixed(3);
  }

  function startTimer() {
    isRunning = true;
    actionBtn.textContent = 'Stop';
    actionBtn.classList.add('btn-stop');
    
    // Clear old result states and reveal the text
    timerDisplay.classList.add('active');
    timerDisplay.classList.remove('failed', 'close', 'hidden-time');
    resultMessage.classList.remove('visible');
    
    startTime = performance.now();
    
    function tick() {
      if (!isRunning) return;
      
      let elapsed = (performance.now() - startTime) / 1000;
      
      // Auto-fail if taking too long
      if (elapsed >= 10.000) {
        elapsed = 10.000;
        timerDisplay.textContent = formatTime(elapsed);
        stopTimer(true); 
        return;
      }
      
      // Exactly after 2 seconds, apply the invisibility mechanic
      if (elapsed >= 2.000) {
        timerDisplay.classList.add('hidden-time');
      }
      
      timerDisplay.textContent = formatTime(elapsed);
      animationFrameId = requestAnimationFrame(tick);
    }
    
    animationFrameId = requestAnimationFrame(tick);
  }

  function stopTimer(forceFail = false) {
    isRunning = false;
    cancelAnimationFrame(animationFrameId);
    
    actionBtn.textContent = 'Start';
    actionBtn.classList.remove('btn-stop');
    
    // Un-hide the numbers and remove active glow upon stopping
    timerDisplay.classList.remove('hidden-time', 'active');
    
    let finalTime = (performance.now() - startTime) / 1000;
    
    // 10-second timeout fail condition
    if (forceFail || finalTime >= 10.000) {
      timerDisplay.textContent = "10.000";
      timerDisplay.classList.add('failed');
      resultMessage.innerHTML = "You are too slow!";
      resultMessage.classList.add('visible');
      return;
    }

    // ==========================================
    // TROLL MECHANIC
    // Prevents exactly stopping on 5.000
    // ==========================================
    let formattedStr = formatTime(finalTime);
    if (formattedStr === "5.000") {
      const offsets = [0.001, 0.002, 0.003, 0.004, -0.001, -0.002, -0.003, -0.004];
      const randomOffset = offsets[Math.floor(Math.random() * offsets.length)];
      finalTime = 5.000 + randomOffset;
    }
    // ==========================================

    timerDisplay.textContent = formatTime(finalTime);
    
    let diff = Math.abs(5.000 - finalTime);
    
    resultMessage.innerHTML = `You were <strong>${formatTime(diff)}</strong> seconds away.`;
    resultMessage.classList.add('visible');
    
    if (diff <= 0.050) {
      timerDisplay.classList.add('close'); // Highlight gold if they were close
    } else if (diff >= 1.000) {
      timerDisplay.classList.add('failed'); // Highlight red if off by a lot
    }
  }

  function handleAction() {
    if (isRunning) {
      stopTimer();
    } else {
      startTimer();
    }
  }

  actionBtn.addEventListener('click', () => {
    handleAction();
    actionBtn.blur();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      handleAction();
    }
  });

})();
</script>
</body>
</html>
